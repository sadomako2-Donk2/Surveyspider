/* Brand fonts, self-hosted (public/fonts) */

@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 800; font-display: swap; src: url(/fonts/montserrat-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/inter-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/inter-latin-500-normal.woff2) format("woff2"); }

/* Layout: Afrimetrica navy-and-gold app shell. Sticky top bar (logo + workspaces), one working column (max 1180px); builder, analysis and pricing split into a main column plus a side rail that stacks on phones. */
:root {
  --bg: #f5f6f9;
  --surface: #ffffff;
  --ink: #0e1d3a;
  --muted: #56627a;
  --line: #dde2ec;
  --accent: #10285a;
  --accent-ink: #ffffff;
  --accent-soft: #e7ecf6;
  --gold: #b88a2c;
  --gold-hi: #f2d27e;
  --gold-soft: #f7efdb;
  --gold-ink: #85601a; /* gold for small text: 4.5:1 or better on light backgrounds */
  --navy-band: #0e1d3a;
  --navy-band-ink: #f4f1e8;
  --signal: #b8651a;
  --signal-soft: #fbeedf;
  --good: #1d7a4f;
  --bad: #b83a2e;
  --font-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  /* design tokens (docs/design-system.md) */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-s: 8px; --radius-m: 14px; --radius-l: 18px;
  --shadow-1: 0 8px 22px rgba(14, 29, 58, 0.1);
  --step--1: 0.85rem; --step-0: 1rem; --step-1: 1.15rem; --step-2: 1.4rem; --step-3: clamp(1.6rem, 3vw, 2.1rem); --step-4: clamp(2.1rem, 5.4vw, 3.6rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1224; --surface: #111c33; --ink: #e9edf6; --muted: #9aa6bf; --line: #24324f;
    --accent: #dcb75a; --accent-ink: #0e1d3a; --accent-soft: #1b2849; --gold: #dcb75a; --gold-hi: #f6dd96; --gold-soft: #2c2716; --gold-ink: #dcb75a;
    --navy-band: #0f1a33; --navy-band-ink: #f4f1e8; --signal: #f0a35b; --signal-soft: #3a2a18; --good: #5cc98f; --bad: #ef7a6d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1224; --surface: #111c33; --ink: #e9edf6; --muted: #9aa6bf; --line: #24324f;
  --accent: #dcb75a; --accent-ink: #0e1d3a; --accent-soft: #1b2849; --gold: #dcb75a; --gold-hi: #f6dd96; --gold-soft: #2c2716; --gold-ink: #dcb75a;
  --navy-band: #0f1a33; --navy-band-ink: #f4f1e8; --signal: #f0a35b; --signal-soft: #3a2a18; --good: #5cc98f; --bad: #ef7a6d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(1.6rem, 3.6vw, 2.3rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.12rem; font-weight: 700; letter-spacing: -0.005em; }
h3 { font-size: 0.95rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.eyebrow.gold { color: var(--gold-ink); }
.muted { color: var(--muted); }
.hint { font-size: 0.85rem; color: var(--muted); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.gold-text { background: linear-gradient(100deg, var(--gold) 0%, var(--gold-hi) 45%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding-block: 10px; }
/* Below 1500px the tabs get their own row under the logo and account, so every tab stays visible. */
@media (max-width: 1499px) { .topbar-inner { padding-block: 8px 6px; } .tabs { order: 3; flex: 1 0 100%; margin-left: -12px; } }
@media (min-width: 1500px) { .topbar-inner { max-width: 1440px; } }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); white-space: nowrap; flex: none; }
.brand svg { display: block; }
.logo-mark .af-a { stroke: var(--ink); }
.logo-mark .af-dot { stroke: var(--surface); stroke-width: 1.4; }
.brand .wm { display: flex; flex-direction: column; line-height: 1; }
.brand .wm b { font-family: var(--font-display); font-weight: 800; font-size: 1.42rem; letter-spacing: -0.01em; }
.brand .wm small i { font-style: normal; color: var(--gold); }
.brand img.logo-mark { display: block; }
.brand .wm small { white-space: nowrap; font-family: var(--font-display); font-weight: 700; font-size: 0.56rem; letter-spacing: 0.2em; color: var(--muted); margin-top: 4px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs a { padding: 7px 11px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.tabs a:hover { color: var(--ink); background: var(--bg); }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--accent-soft); }
.count { font-family: var(--font-mono); font-size: 0.7rem; background: var(--gold); color: #0e1d3a; border-radius: 999px; padding: 0 6px; }

.banner { max-width: 1180px; margin: 12px auto 0; padding: 10px 14px; border-radius: 8px; background: var(--signal-soft); color: var(--ink); font-size: 0.88rem; }
main { max-width: 1180px; margin: 0 auto; padding-block: 28px 80px; display: flex; flex-direction: column; gap: 24px; }

/* Primitives */
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; }
.wrap { flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.btn { font: inherit; font-weight: 500; font-size: 0.9rem; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.gold { background: linear-gradient(100deg, #b88a2c, #e9c46a 55%, #c4952f); border-color: transparent; color: #0e1d3a; font-weight: 600; }
.btn.gold:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 0.82rem; }
.btn.big { padding: 12px 22px; font-size: 1rem; align-self: flex-start; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
label { display: flex; flex-direction: column; gap: 5px; font-size: 0.84rem; color: var(--muted); font-weight: 500; }
label.inline { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); }
input, textarea, select { font: inherit; font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
textarea { resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.span2 { grid-column: 1 / -1; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
details summary { cursor: pointer; font-size: 0.88rem; font-weight: 500; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; margin-top: 8px; }
.checks label { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); font-weight: 400; }
.pill { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.pill.live { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.flag { background: var(--signal-soft); color: var(--signal); border-color: transparent; }
.pill.bad { color: var(--bad); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.errs { border-left: 3px solid var(--bad); padding: 8px 12px; background: var(--surface); font-size: 0.88rem; }
.errs ul { margin: 4px 0 0; padding-left: 18px; }
.empty { text-align: left; padding: 32px; border: 1px dashed var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 16px; }
.hero h1 { font-size: clamp(2.1rem, 5.4vw, 3.6rem); }
.hero .lede { font-size: 1.08rem; color: var(--muted); max-width: 56ch; margin-top: 14px; }
.hero-ctas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.flow { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.flow-step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 16px 18px; }
.flow-step + .flow-step { border-top: 1px solid var(--line); }
.flow-step b { font-family: var(--font-display); font-size: 1.05rem; display: block; }
.flow-step span.n { font-family: var(--font-mono); color: var(--accent); font-size: 0.85rem; padding-top: 2px; }
.flow-step p { color: var(--muted); font-size: 0.9rem; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 0.82rem; color: var(--muted); }
.features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.features ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
.features .from { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }

/* Builder */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
.q-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.q-top select { width: auto; flex: 0 1 190px; }
.q-top .row { margin-left: auto; }
.q-num { font-family: var(--font-mono); font-weight: 500; color: var(--accent); }
.icon { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; }
.icon:disabled { opacity: 0.35; cursor: default; }
.add-q { flex-direction: row; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.cost-row { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; }
.cost-row span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.cost-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 10px; }
.cost-total b { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.ok { color: var(--accent); }
.warn { color: var(--signal); }
.templates { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.tpl { text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
.tpl:hover { border-color: var(--accent); }
.tpl .meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }

/* Study lists */
.list { display: flex; flex-direction: column; gap: 10px; }
.study { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.study-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.study-title { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.meta-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.84rem; color: var(--muted); }
.meta-row span { font-variant-numeric: tabular-nums; }
.progress { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; max-width: 320px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); }
@media (max-width: 700px) { .study { grid-template-columns: 1fr; } }

/* Panel */
.panel-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.earn { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.earn div { display: flex; flex-direction: column; }
.earn b { font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.earn span { font-size: 0.78rem; color: var(--muted); }
.reward { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 0.9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* Take */
.take { max-width: 720px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.take fieldset.card legend { float: left; width: 100%; padding: 0; margin-bottom: 12px; font-weight: 600; font-size: 1rem; color: var(--ink); }
.take fieldset.card legend + * { clear: both; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { flex-direction: row; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font-weight: 400; font-size: 0.95rem; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.scale { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 6px; }
.scale .opt { justify-content: center; flex-direction: column; gap: 4px; font-family: var(--font-mono); padding: 10px 2px; }
.likert .opt { font-family: var(--font-body); font-size: 0.84rem; text-align: center; line-height: 1.3; padding: 10px 6px; }
@media (max-width: 640px) { .likert { grid-template-columns: 1fr; } .likert .opt { flex-direction: row; justify-content: flex-start; text-align: left; } }
.scale-edit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .scale-edit { grid-template-columns: 1fr; } }
.scale-ends { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
.req { color: var(--bad); }
.done { align-items: flex-start; }

/* Results */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.results-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.br { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr) 88px; gap: 10px; align-items: center; font-size: 0.88rem; }
.br-l { overflow-wrap: anywhere; }
.br-t { height: 12px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.br-t i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.br-v { font-family: var(--font-mono); font-size: 0.8rem; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .br { grid-template-columns: minmax(0, 1fr) 80px; } .br-l { grid-column: 1 / -1; } }
.qmeta { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.bigstat { font-family: var(--font-display); font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.quotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.quotes li { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; font-size: 0.92rem; overflow-wrap: anywhere; }
.table-wrap { overflow-x: auto; }
.table-wrap:focus-visible { outline: 3px solid var(--gold-hi, #e9c46a); outline-offset: 2px; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; white-space: nowrap; }
td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Library */
.lib-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.headline { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.links { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; }
.links span { display: block; color: var(--muted); font-size: 0.82rem; }

/* Import */
.import-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.drop { border: 2px dashed var(--line); border-radius: 14px; background: var(--surface); padding: 36px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; cursor: pointer; color: var(--ink); font-size: 1rem; font-weight: 400; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop b { font-family: var(--font-display); font-size: 1.25rem; }
.drop .types { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.status { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); font-size: 0.92rem; flex-wrap: wrap; }
.status.err { background: var(--signal-soft); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin 0.8s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.found { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.found li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.found .q-num { padding-top: 1px; }
.found .opts-mini { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.found .opts-mini span { font-size: 0.78rem; padding: 2px 8px; border-radius: 4px; background: var(--bg); color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; color: var(--muted); }
.note-import { border-left: 3px solid var(--accent); background: var(--surface); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 0.9rem; }
@media (max-width: 960px) { .import-grid { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .found li { grid-template-columns: 32px minmax(0, 1fr); } .found li .pill { grid-column: 2; justify-self: start; } }

/* Home */
.hero2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-block: 16px 4px; }
.hero2 h1 { font-size: clamp(2.1rem, 5vw, 3.35rem); line-height: 1.08; }
.hero2 .lede { font-size: 1.08rem; color: var(--muted); max-width: 56ch; margin-top: 14px; }
.ai-box { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 14px 34px -22px rgba(14, 29, 58, 0.45); }
.ai-box label { color: var(--ink); font-weight: 600; font-size: 0.92rem; }
.hero-alt { margin-top: 12px; }
.report-mock { background: var(--navy-band); color: var(--navy-band-ink); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(220, 183, 90, 0.35); min-width: 0; }
.report-mock .eyebrow { color: var(--gold-hi); }
.report-mock .pill { color: var(--navy-band-ink); border-color: rgba(255, 255, 255, 0.25); }
.rm-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rm-title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.rm-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rm-kpis div { background: rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; }
.rm-kpis b { font-family: var(--font-display); font-size: 1.6rem; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.rm-kpis span { font-size: 0.78rem; opacity: 0.8; }
.rm-find { font-size: 0.88rem; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rm-rec { font-size: 0.88rem; border-top: 1px solid rgba(255, 255, 255, 0.15); padding-top: 10px; }
.rm-rec b { color: var(--gold-hi); display: block; font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 2px; }
.tag { font-family: var(--font-display); font-weight: 700; font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.tag.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.tag.warn { background: var(--signal-soft); color: var(--signal); }
.tag.info { background: var(--gold-soft); color: var(--gold); }
.report-mock .tag.good { color: #84e2b3; }
.report-mock .tag.warn { color: #f4b46e; background: rgba(244, 180, 110, 0.14); }
.report-mock .tag.info { color: var(--gold-hi); background: rgba(242, 210, 126, 0.12); }
.section-head { display: flex; flex-direction: column; gap: 6px; }
.h2xl { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; letter-spacing: -0.015em; }
.ways { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.way { text-decoration: none; color: var(--ink); }
.way:hover { border-color: var(--gold); }
.way-n { font-family: var(--font-display); font-weight: 800; font-size: 0.78rem; letter-spacing: 0.14em; color: var(--gold-ink); }
.way p { color: var(--muted); font-size: 0.92rem; }
.diff { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.diff .card { gap: 8px; }
.diff p { color: var(--muted); font-size: 0.88rem; }
.band { background: var(--navy-band); color: var(--navy-band-ink); border-radius: 18px; padding: 28px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 24px; align-items: center; }
.band h2 { color: var(--navy-band-ink); font-size: clamp(1.3rem, 2.6vw, 1.8rem); font-weight: 800; }
.band p { opacity: 0.82; }
.band .eyebrow { color: var(--gold-hi); }
.band-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.band-item { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 14px; text-align: left; font: inherit; color: var(--navy-band-ink); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.band-item:hover { border-color: var(--gold-hi); }
a.band-item { text-decoration: none; }
.band-item b { font-family: var(--font-display); }
.band-item span { font-size: 0.82rem; opacity: 0.75; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.ticks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.ticks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; }
.ticks li::before { content: ""; width: 14px; height: 14px; margin-top: 4px; background: linear-gradient(135deg, var(--gold), var(--gold-hi)); clip-path: polygon(0 0, 100% 100%, 0 100%); }
.ticks b { display: block; }
.ticks span { color: var(--muted); font-size: 0.9rem; }
.cta-strip { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--gold-soft); border-radius: 14px; padding: 20px 24px; }
.cta-strip h2 { font-size: 1.25rem; }
@media (max-width: 960px) { .hero2, .band, .split { grid-template-columns: 1fr; } .ways { grid-template-columns: 1fr; } .diff { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .diff, .band-list { grid-template-columns: 1fr; } .band { padding: 20px; } }

/* Pricing */
.bill-toggle { flex: none; white-space: nowrap; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.bill-toggle button { font: inherit; font-size: 0.88rem; border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.bill-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.plans { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: stretch; padding-top: 10px; }
.plan { position: relative; }
.plan.popular { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.plan .badge { position: absolute; top: -11px; left: 16px; background: linear-gradient(100deg, #b88a2c, #e9c46a); color: #0e1d3a; font-family: var(--font-display); font-weight: 700; font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
.price { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.price b { font-family: var(--font-display); font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.price span { color: var(--muted); font-size: 0.85rem; }
.plan ul { margin: 0; padding-left: 18px; font-size: 0.86rem; color: var(--muted); display: flex; flex-direction: column; gap: 5px; flex: 1; }
.plan .btn { justify-content: center; }
.save { font-size: 0.78rem; color: var(--good); font-weight: 600; }
td.us { background: var(--gold-soft); font-weight: 600; }
@media (max-width: 1100px) { .plans { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .plans { grid-template-columns: 1fr; } }

/* Create with AI + question checker */
.gen { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); background: linear-gradient(180deg, var(--gold-soft), var(--surface) 70%); }
.tpl-group { display: flex; flex-direction: column; gap: 10px; }
.checks-ai { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 12px; font-size: 0.88rem; }
.rewrite { margin: 6px 0; padding: 8px 10px; background: var(--bg); border-radius: 6px; }

/* Analyze */
.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.subtab { font: inherit; font-size: 0.9rem; font-weight: 500; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.subtab:hover { color: var(--ink); }
.subtab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); font-weight: 600; }
.insight-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.insight { gap: 8px; border-top: 3px solid var(--line); }
.insight.t-good { border-top-color: var(--good); }
.insight.t-warn { border-top-color: var(--signal); }
.insight.t-info { border-top-color: var(--gold); }
.insight .tag { align-self: flex-start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 0.82rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.chip:hover:not(:disabled) { border-color: var(--gold); }
.chip:disabled { opacity: 0.5; cursor: default; }
.answer { white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 14px 16px; font-size: 0.93rem; border-left: 3px solid var(--gold); }
.driver { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 30%) 130px; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 0.9rem; }
.driver .br-t i.neg { background: var(--signal); }
.driver .v { font-family: var(--font-mono); font-size: 0.8rem; text-align: right; }
@media (max-width: 640px) { .driver { grid-template-columns: minmax(0, 1fr) 110px; } .driver .br-t { grid-column: 1 / -1; grid-row: 2; } }
.callout { background: var(--gold-soft); border-radius: 10px; padding: 14px 16px; font-size: 0.95rem; }
td.hi { font-weight: 700; color: var(--accent); }
.rep-head h2 { font-size: 1.4rem; font-weight: 800; }
.rec { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.rec p { color: var(--muted); font-size: 0.9rem; }
.findings { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.findings p { color: var(--muted); font-size: 0.9rem; }

/* Analyze · decision intelligence */
.filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.filterbar select { width: auto; max-width: 240px; padding: 6px 8px; font-size: 0.86rem; }
.cols { display: flex; align-items: flex-end; gap: 3px; height: 110px; }
.cols span { flex: 1 1 0; min-width: 0; background: var(--accent); border-radius: 3px 3px 0 0; }
.cols span.zero { background: var(--line); }
.grade { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.grade-badge { width: 92px; height: 92px; border-radius: 18px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 3rem; color: #ffffff; }
.g-A { background: var(--good); }
.g-B { background: linear-gradient(135deg, #b88a2c, #e9c46a); color: #0e1d3a; }
.g-C { background: var(--signal); }
.g-D { background: var(--bad); }
.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.meter { display: flex; flex-direction: column; gap: 4px; }
.meter b { font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.issue { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.9rem; align-items: start; }
.msgs { display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow-y: auto; padding: 4px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; font-size: 0.93rem; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--bg); border-left: 3px solid var(--gold); border-bottom-left-radius: 4px; }
.stat-line { font-family: var(--font-mono); font-size: 0.86rem; background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.action-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.action.done { opacity: 0.7; }
.metric-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.metric-row div { background: var(--bg); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.metric-row b { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.metric-row span { font-size: 0.74rem; color: var(--muted); }
.overdue { color: var(--bad); font-weight: 600; }
.pcheck { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; margin-top: 6px; }
.pcheck label { flex-direction: row; gap: 8px; color: var(--ink); font-weight: 400; }
@media (max-width: 760px) { .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grade { grid-template-columns: 1fr; } .metric-row { grid-template-columns: 1fr; } }

/* Paper survey */
.f2f-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 460px); gap: 20px; align-items: start; }
.f2f-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
.quote { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }
.quote-head { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
.quote-total { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); }
.quote-head { flex-direction: column; }
.quote-time { display: flex; flex-direction: column; font-size: 0.82rem; color: var(--muted); border-left: 3px solid var(--gold); padding-left: 10px; }
.quote-time b { font-family: var(--font-display); color: var(--ink); font-size: 1rem; }
.quote-table td:first-child { min-width: 180px; }
.quote-table tr.qgroup td { font-family: var(--font-display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); padding-top: 14px; border-bottom: 0; }
.quote-table tr.qtotal td { font-weight: 700; font-size: 1rem; border-top: 2px solid var(--ink); border-bottom: 0; }
@media (max-width: 960px) { .f2f-grid { grid-template-columns: 1fr; } .f2f-side { position: static; } }

/* Accounts */
.acct { flex: none; margin-left: auto; position: relative; order: 2; }
.acct-menu { border: 0; padding: 0; border-radius: 0; }
.acct-menu summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.acct-menu summary::-webkit-details-marker { display: none; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #b88a2c, #e9c46a); color: #0e1d3a; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 0.74rem; flex: none; }
.acct-name { font-size: 0.86rem; font-weight: 500; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-pop { position: absolute; right: 0; top: calc(100% + 8px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 230px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 14px 34px -18px rgba(14, 29, 58, 0.5); z-index: 6; }
.acct-pop .btn { align-self: flex-start; margin-top: 6px; }
.auth-wrap { display: flex; justify-content: center; padding-block: 8px 24px; }
.auth-card { width: 100%; max-width: 440px; gap: 14px; padding: 28px; }
.btn.google { justify-content: center; background: var(--surface); border-color: var(--line); font-weight: 600; padding: 11px 16px; gap: 10px; }
.btn.google:hover { border-color: var(--ink); }
.btn.google svg { width: 18px; height: 18px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.82rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.linkbtn { font: inherit; background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; }
@media (max-width: 560px) { .acct-name { display: none; } .acct-menu summary { padding: 3px; } }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; z-index: 20; max-width: calc(100% - 32px); }
footer { max-width: 1180px; margin: 0 auto; padding-block: 0 40px; color: var(--muted); font-size: 0.82rem; }

@media (max-width: 960px) {
  .builder, .panel-grid, .results-grid, .lib-grid, .hero { grid-template-columns: 1fr; }
  .side { position: static; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .features { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .stats, .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: 1fr; }
  .topbar-inner { gap: 10px; }
  .brand .wm small { display: none; }
  .brand .wm b { font-size: 1.05rem; }
}
/* Afrimetrica: survey sub-navigation, institution pages, Academy, Insights */

.pillars-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--navy-band); border-radius: 18px; padding: 16px; border: 1px solid rgba(220, 183, 90, 0.35); }
.pillar { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 14px; color: var(--navy-band-ink); text-decoration: none; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.course-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

.course h3 { font-size: 1.08rem; }
.course p { font-size: 0.9rem; }
.course-meta { display: flex; flex-direction: column; gap: 2px; font-size: 0.86rem; border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; }

.guide-link { text-decoration: none; color: var(--ink); gap: 4px; padding: 14px 16px; }

.prose p { max-width: 70ch; }
.prose h2 { font-size: 1.12rem; margin-top: 6px; }
.lede-sm { font-size: 1.04rem; color: var(--muted); }
.guide { max-width: 820px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.calc-out { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

      if ((ty === "single" || ty === "multi" || ty === "likert") && options.length < 2) ty = "text";

    try {
      const r = await SAMPLE.json(prompt);
      const items = (Array.isArray(r) ? r : []).filter((x) => x && +x.q >= 1 && +x.q <= d.questions.length).slice(0, 8)
        .map((x) => ({ q: +x.q, qid: d.questions[+x.q - 1].id, issue: String(x.issue || "").slice(0, 300), rewrite: String(x.rewrite || "").slice(0, 400) }));
      S.aiCheck = { items, draftId: d.id };
    } catch (e) { S.aiCheck = null; aiError(e, "The check couldn't run this time. Try again."); }
    if (S.view === "create") render();
  }

  // ---------- ANALYTICS ENGINE ----------
  const SEGS = [["country", "Country"], ["gender", "Gender"], ["age", "Age group"], ["occupation", "Occupation"]];
  const short = (t, n = 70) => (String(t).length > n ? String(t).slice(0, n - 1) + "…" : String(t));
  const isNumQ = (q) => q.type === "rating" || q.type === "likert" || q.type === "number";
  function scoreOf(q, v) {
    if (v == null || v === "") return null;
    if (q.type === "rating" || q.type === "number") { const n = +v; return isNaN(n) ? null : n; }
    if (q.type === "likert") { const i = q.options.indexOf(v); return i < 0 ? null : i + 1; }
    return null;
  }
  function normScore(q, v) {
    const s = scoreOf(q, v); if (s == null) return null;
    if (q.type === "rating") { const sc = scaleOf(q); return (s - sc.min) / (sc.max - sc.min || 1); }
    if (q.type === "likert") return (s - 1) / (q.options.length - 1 || 1);
    return null;
  }
  const scaleMax = (q) => (q.type === "rating" ? scaleOf(q).max : q.type === "likert" ? q.options.length : null);
  const fmtAvg = (q, a) => (a == null ? "–" : q.type === "number" ? (+a).toLocaleString("en-US", { maximumFractionDigits: 1 }) : `${a.toFixed(1)} of ${scaleMax(q)}`);
  const avgOf = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
  function segValue(r, key) {
    if (key.startsWith("q:")) { const v = r.answers && r.answers[key.slice(2)]; return v == null || v === "" ? null : String(v); }
    const d = r.demographics || {};
    return key === "age" ? ageBand(d.age) : d[key] || null;
  }
  function groupRows(rows, key) {
    const m = new Map();
    rows.forEach((r) => { const v = segValue(r, key); if (v == null || v === "Unknown") return; if (!m.has(v)) m.set(v, []); m.get(v).push(r); });
    return [...m].sort((a, b) => b[1].length - a[1].length);
  }
  function pearson(x, y) {
    const n = x.length; if (n < 3) return null;
    const mx = avgOf(x), my = avgOf(y); let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < n; i++) { const dx = x[i] - mx, dy = y[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
    return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
  }
  const strength = (r) => { const a = Math.abs(r); return a >= 0.5 ? "Strong" : a >= 0.3 ? "Moderate" : a >= 0.1 ? "Weak" : "No clear link"; };
  function npsOf(q, rows) {
    const nums = rows.map((r) => scoreOf(q, r.answers[q.id])).filter((x) => x != null);
    if (!nums.length) return null;
    const pro = nums.filter((x) => x >= 9).length, det = nums.filter((x) => x <= 6).length;
    return { nps: Math.round(((pro - det) / nums.length) * 100), pro: pct(pro, nums.length), det: pct(det, nums.length), n: nums.length };
  }
  function autoInsights(st, rows) {
    const out = [];
    if (!rows.length) return out;
    const items = st.questions.filter((q) => q.type === "rating" || q.type === "likert").map((q) => {
      const v = rows.map((r) => normScore(q, r.answers[q.id])).filter((x) => x != null);
      return { q, avg: avgOf(v), raw: avgOf(rows.map((r) => scoreOf(q, r.answers[q.id])).filter((x) => x != null)), n: v.length };
    }).filter((x) => x.avg != null);
    const ranked = [...items].sort((a, b) => b.avg - a.avg);
    if (ranked.length >= 2) {
      const top = ranked[0], low = ranked[ranked.length - 1];
      out.push({ tone: "good", label: "Strongest area", title: short(top.q.text, 90), text: `Average ${fmtAvg(top.q, top.raw)}, the highest of ${ranked.length} scale questions (${Math.round(top.avg * 100)}% of the maximum).` });
      out.push({ tone: "warn", label: "Fix first", title: short(low.q.text, 90), text: `Average ${fmtAvg(low.q, low.raw)}, the lowest of the scale questions (${Math.round(low.avg * 100)}% of the maximum).` });
    } else if (ranked.length === 1) {
      out.push({ tone: "info", label: "Average score", title: short(ranked[0].q.text, 90), text: `Average ${fmtAvg(ranked[0].q, ranked[0].raw)} from ${ranked[0].n} answers.` });
    }
    st.questions.filter((q) => q.type === "rating" && scaleOf(q).min === 0 && scaleOf(q).max === 10).forEach((q) => {
      const n = npsOf(q, rows); if (!n) return;
      const word = n.nps >= 50 ? "Excellent" : n.nps >= 20 ? "Good" : n.nps >= 0 ? "Fair" : "Needs work";
      out.push({ tone: n.nps >= 0 ? "good" : "warn", label: "Net Promoter Score", title: `${n.nps > 0 ? "+" : ""}${n.nps} · ${word}`, text: `${n.pro}% promoters (9–10) and ${n.det}% detractors (0–6) on "${short(q.text, 60)}".` });
    });
    st.questions.filter((q) => q.type === "likert").slice(0, 2).forEach((q) => {
      const v = rows.map((r) => r.answers[q.id]).filter((x) => x != null);
      if (!v.length) return;
      const top2 = pct(v.filter((x) => q.options.slice(-2).includes(x)).length, v.length);
      out.push({ tone: top2 >= 60 ? "good" : top2 >= 40 ? "info" : "warn", label: "Top-2 box", title: `${top2}% positive`, text: `chose "${q.options[q.options.length - 2]}" or "${q.options[q.options.length - 1]}" for "${short(q.text, 60)}".` });
    });
    st.questions.filter((q) => q.type === "single").slice(0, 2).forEach((q) => {
      const v = rows.map((r) => r.answers[q.id]).filter((x) => x != null);
      if (!v.length) return;
      const c = new Map(); v.forEach((x) => c.set(x, (c.get(x) || 0) + 1));
      const [ans, k] = [...c].sort((a, b) => b[1] - a[1])[0];
      out.push({ tone: "info", label: "Most common answer", title: short(ans, 60), text: `${pct(k, v.length)}% chose this for "${short(q.text, 60)}".` });
    });
    let best = null;
    items.forEach(({ q }) => SEGS.forEach(([key, label]) => {
      const g = groupRows(rows, key).map(([name, rs]) => ({ name, n: rs.length, avg: avgOf(rs.map((r) => normScore(q, r.answers[q.id])).filter((x) => x != null)) })).filter((x) => x.n >= 3 && x.avg != null);
      if (g.length < 2) return;
      g.sort((a, b) => b.avg - a.avg);
      const diff = g[0].avg - g[g.length - 1].avg;
      if (!best || diff > best.diff) best = { diff, q, label, hi: g[0], lo: g[g.length - 1] };
    }));
    if (best && best.diff >= 0.1) out.push({ tone: "info", label: "Biggest group difference", title: `${best.hi.name} vs ${best.lo.name}`, text: `On "${short(best.q.text, 60)}", ${best.label.toLowerCase()} "${best.hi.name}" scored ${Math.round(best.diff * 100)} points higher than "${best.lo.name}" (${Math.round(best.hi.avg * 100)}% vs ${Math.round(best.lo.avg * 100)}% of the maximum).` });
    const all = respFor(st.id), fl = all.filter((r) => r.status === "flagged" || r.status === "rejected").length;
    if (all.length >= 5) out.push({ tone: fl / all.length > 0.15 ? "warn" : "good", label: "Data quality", title: `${pct(all.length - fl, all.length)}% passed quality checks`, text: `${fl} of ${all.length} responses failed the attention check or were too fast.` });
    return out;
  }
  function defaultOutcome(st) {
    const nq = st.questions.filter(isNumQ);
    return (nq.find((q) => /overall|recommend|satisf/i.test(q.text)) || nq[nq.length - 1] || {}).id;
  }
  function driversFor(st, rows, outId) {
    const out = st.questions.find((q) => q.id === outId);
    if (!out) return [];
    return st.questions.filter((q) => isNumQ(q) && q.id !== outId).map((q) => {
      const xs = [], ys = [];
      rows.forEach((r) => { const a = scoreOf(q, r.answers[q.id]), b = scoreOf(out, r.answers[out.id]); if (a != null && b != null) { xs.push(a); ys.push(b); } });
      return { q, r: xs.length >= 5 ? pearson(xs, ys) : null, n: xs.length };
    }).sort((a, b) => (b.r == null ? -1 : Math.abs(b.r)) - (a.r == null ? -1 : Math.abs(a.r)));
  }
  function dataSummary(st, rows) {
    const L = [`Survey: ${st.title}`, `Description: ${st.description || ""}`, `Responses analysed: ${rows.length}`];
    SEGS.forEach(([k, label]) => { const g = groupRows(rows, k), big = g.filter(([, rs]) => rs.length >= 3).slice(0, 8), small = g.filter(([, rs]) => rs.length < 3).reduce((a, [, rs]) => a + rs.length, 0); L.push(`${label}: ` + big.map(([v, rs]) => `${v} ${rs.length}`).join(", ") + (small ? `${big.length ? ", " : ""}smaller groups combined ${small}` : "")); });
    st.questions.forEach((q, i) => {
      L.push(`\nQ${i + 1} [${typeLabel(q)}] ${q.text}`);
      const vals = rows.map((r) => r.answers[q.id]).filter((v) => v != null && v !== "");
      if (q.type === "single" || q.type === "multi" || q.type === "likert") {
        const c = new Map(q.options.map((o) => [o, 0]));
        vals.forEach((v) => (Array.isArray(v) ? v : [v]).forEach((x) => c.set(x, (c.get(x) || 0) + 1)));
        L.push([...c].map(([o, k]) => `${o}: ${k} (${pct(k, rows.length)}%)`).join("; "));
        if (q.type === "likert") L.push(`Average score ${fmtAvg(q, avgOf(vals.map((v) => scoreOf(q, v)).filter((x) => x != null)))}`);
      } else if (q.type === "rating" || q.type === "number") {
        const nums = vals.map(Number).filter((x) => !isNaN(x));
        if (nums.length) L.push(`Average ${avgOf(nums).toFixed(2)}, median ${median(nums)}, lowest ${Math.min(...nums)}, highest ${Math.max(...nums)}${q.type === "rating" ? ` on a ${scaleOf(q).min}–${scaleOf(q).max} scale` : ""}`);
        if (q.type === "rating" && scaleOf(q).min === 0 && scaleOf(q).max === 10) { const n = npsOf(q, rows); if (n) L.push(`NPS ${n.nps}`); }
      } else {
        vals.slice(0, 60).forEach((v) => L.push(`- ${String(v).slice(0, 220).replace(/\s+/g, " ")}`));
        if (vals.length > 60) L.push(`(${vals.length - 60} more answers not shown)`);
      }
    });
    const ins = autoInsights(st, rows);
    if (ins.length) { L.push("\nAutomatic findings:"); ins.forEach((c) => L.push(`- ${c.label}: ${c.title}. ${c.text}`)); }
    const out = defaultOutcome(st);
    if (out) { const dr = driversFor(st, rows, out).filter((d) => d.r != null).slice(0, 4); if (dr.length) { L.push(`\nCorrelations with "${st.questions.find((q) => q.id === out).text}":`); dr.forEach((d) => L.push(`- ${d.q.text}: r = ${d.r.toFixed(2)}`)); } }
    return L.join("\n").slice(0, 90000);
  }

  // ---------- ANALYZE TABS ----------
  function viewInsights(st, rows) {
    const cards = autoInsights(st, rows);
    return `<div class="insight-grid">${cards.map(insightCard).join("") || `<div class="empty"><p class="muted">Add rating, Likert or multiple-choice questions to get insight cards.</p></div>`}</div>
      ${rows.length < 10 ? `<p class="hint">Based on ${rows.length} response${rows.length === 1 ? "" : "s"}. Findings become more reliable with 30 or more.</p>` : ""}
      <section class="cta-strip"><div><h2>Have a question these cards don't answer?</h2><p class="muted">The AI analyst answers in plain English, using only your data.</p></div><button class="btn primary" data-act="anTab" data-k="analyst">Ask the AI analyst</button></section>`;
  }
  function askCard() {
    const a = S.ask;
    return `<section class="card"><div><span class="eyebrow gold">Ask your data</span><h2>Ask a question in plain English</h2></div>
      <form id="askForm" class="row wrap"><input id="askQ" maxlength="300" style="flex:1 1 260px" placeholder="e.g. What do people who scored us low have in common?" value="${esc(a.q)}"><button class="btn primary" type="submit" ${SAMPLE && !a.busy ? "" : "disabled"}>${a.busy ? "Thinking…" : "Ask"}</button></form>
      <div class="chips">${["What are the three main takeaways?", "Which group is least satisfied, and why?", "What should we change first?", "Summarise the open-text answers"].map((x) => `<button class="chip" data-act="askChip" data-q="${esc(x)}" ${SAMPLE && !a.busy ? "" : "disabled"}>${esc(x)}</button>`).join("")}</div>
      <div id="askOut" class="answer"${a.a || a.busy ? "" : " hidden"}>${esc(a.a || "Thinking…")}</div>
      ${SAMPLE ? `<p class="hint">Your survey results, including open-text answers, are sent to Claude to answer. Individual participants are never identified.</p>` : `<p class="hint">${aiOff()}</p>`}</section>`;
  }
  async function runAsk(q) {
    const st = studyById(S.resultsId); if (!st || !SAMPLE || !q.trim()) return;
    const rows = currentRows(st);
    S.ask = { q, a: "", busy: true }; render();
    const prompt = `You are a senior research analyst at Afrimetrica. Answer the client's question using only the survey data below.
Be specific and quote numbers. If the data cannot answer it, say so and suggest what to ask in a future survey. Plain English, under 220 words, short paragraphs or "-" bullets, no markdown headings.

Question: ${q}

Survey data:
${dataSummary(st, rows)}`;
    try {
      await SAMPLE(prompt, { cache: false, onText: ({ text }) => { S.ask.a = text; const el = $("#askOut"); if (el) { el.hidden = false; el.textContent = text; } } });
    } catch (e) { if (e && e.text) S.ask.a = e.text; aiError(e, "Claude couldn't answer this time. Try again."); }
    S.ask.busy = false; render();
  }
  function viewCompare(st, rows) {
    const qOpts = st.questions.filter((q) => q.type !== "text");
    if (!qOpts.length) return `<div class="empty"><p class="muted">Add a question that isn't open text to compare groups.</p></div>`;
    if (!qOpts.some((q) => q.id === S.segQ)) S.segQ = qOpts[0].id;
    const q = st.questions.find((x) => x.id === S.segQ);
    const segOpts = [...SEGS, ...st.questions.filter((x) => (x.type === "single" || x.type === "likert") && x.id !== q.id).map((x) => ["q:" + x.id, "Answer to: " + short(x.text, 48)])];
    if (!segOpts.some(([k]) => k === S.segKey)) S.segKey = "country";
    const groups = safeGroups(rows, S.segKey).slice(0, 6);
    const controls = `<div class="grid2"><label for="segQ">Show results for<select id="segQ">${qOpts.map((x) => `<option value="${x.id}"${x.id === q.id ? " selected" : ""}>${esc(short(x.text, 80))}</option>`).join("")}</select></label>
      <label for="segKey">Split by<select id="segKey">${segOpts.map(([k, l]) => `<option value="${k}"${k === S.segKey ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></label></div>`;
    if (groups.length < 2) return `<section class="card">${controls}<p class="muted">Everyone so far is in the same group, so there is nothing to compare yet.</p></section>`;
    let table, insight = "";
    if (isNumQ(q)) {
      const g = groups.map(([name, rs]) => ({ name, n: rs.length, avg: avgOf(rs.map((r) => scoreOf(q, r.answers[q.id])).filter((x) => x != null)), norm: avgOf(rs.map((r) => (q.type === "number" ? scoreOf(q, r.answers[q.id]) : normScore(q, r.answers[q.id]))).filter((x) => x != null)) })).filter((x) => x.avg != null);
      const mx = Math.max(...g.map((x) => x.norm || 0), 0.0001);
      const sorted = [...g].sort((a, b) => b.avg - a.avg);
      if (sorted.length >= 2) insight = `<p class="callout"><b>${esc(sorted[0].name)}</b> scored highest (${fmtAvg(q, sorted[0].avg)}) and <b>${esc(sorted[sorted.length - 1].name)}</b> lowest (${fmtAvg(q, sorted[sorted.length - 1].avg)}).${g.some((x) => x.n < 5) ? " Some groups have fewer than 5 people, so treat their results with care." : ""}</p>`;
      table = `<div class="table-wrap" tabindex="0"><table><thead><tr><th>Group</th><th>People</th><th>Average</th><th style="width:40%"></th></tr></thead><tbody>${g.map((x) => `<tr><td>${esc(x.name)}</td><td class="n">${x.n}</td><td class="n">${fmtAvg(q, x.avg)}</td><td><span class="br-t" style="display:block"><i style="width:${((x.norm / mx) * 100).toFixed(1)}%"></i></span></td></tr>`).join("")}</tbody></table></div>`;
    } else {
      const opts = q.options;
      const cell = (rs, o) => { const v = rs.map((r) => r.answers[q.id]).filter((x) => x != null); return pct(v.filter((x) => (Array.isArray(x) ? x.includes(o) : x === o)).length, rs.length); };
      table = `<div class="table-wrap" tabindex="0"><table><thead><tr><th>Answer</th>${groups.map(([n, rs]) => `<th>${esc(short(n, 22))} (${rs.length})</th>`).join("")}</tr></thead><tbody>${opts.map((o) => { const vals = groups.map(([, rs]) => cell(rs, o)); const mx = Math.max(...vals); return `<tr><td>${esc(o)}</td>${vals.map((v) => `<td class="n${v === mx && v > 0 ? " hi" : ""}">${v}%</td>`).join("")}</tr>`; }).join("")}</tbody></table></div><p class="hint">Percentages are of each group. The highest value in each row is highlighted.</p>`;
    }
    return `<section class="card">${controls}${insight}${table}</section>`;
  }
  function viewDrivers(st, rows) {
    const nq = st.questions.filter(isNumQ);
    if (nq.length < 2) return `<div class="empty"><h2>Key driver analysis needs two scale questions</h2><p class="muted">Add at least two rating, Likert or number questions, for example an overall satisfaction score and the things that might affect it.</p></div>`;
    if (!nq.some((q) => q.id === S.driverOut)) S.driverOut = defaultOutcome(st);
    const out = st.questions.find((q) => q.id === S.driverOut);
    const res = driversFor(st, rows, out.id);
    const top = res.find((d) => d.r != null);
    return `<section class="card">
      <label for="drvOut">Headline score to explain<select id="drvOut">${nq.map((q) => `<option value="${q.id}"${q.id === out.id ? " selected" : ""}>${esc(short(q.text, 90))}</option>`).join("")}</select></label>
      ${rows.length < 5 ? `<p class="callout">Key driver analysis needs at least 5 responses. You have ${rows.length}.</p>` : top ? `<p class="callout">The strongest link with <b>"${esc(short(out.text, 70))}"</b> is <b>"${esc(short(top.q.text, 70))}"</b> (r = ${top.r.toFixed(2)}, ${strength(top.r).toLowerCase()}). ${top.r > 0 ? "People who score higher on it also tend to score higher on the headline score, so improving it is the best place to start." : "People who score higher on it tend to score lower on the headline score."}</p>` : ""}
      <div>${res.map((d) => `<div class="driver"><span>${esc(d.q.text)}</span><span class="br-t"><i class="${d.r != null && d.r < 0 ? "neg" : ""}" style="width:${d.r == null ? 0 : (Math.abs(d.r) * 100).toFixed(1)}%"></i></span><span class="v">${d.r == null ? `n = ${d.n}, too few` : `r = ${d.r.toFixed(2)} · ${strength(d.r)}`}</span></div>`).join("")}</div>
      <p class="hint">r is the correlation, from −1 to +1. It shows which answers move together, not proof that one causes the other. Use it to decide where to look first.</p></section>`;
  }
  function viewReport(st, rows) {
    const rep = S.reports[st.id] || st.aiReport;
    if (S.aiBusy === st.id) return `<div class="status"><span class="spin" aria-hidden="true"></span><span>Claude is reading ${rows.length} responses and writing your report. This can take up to a minute.</span><button class="btn small" data-act="impStop">Stop</button></div>`;
    const btn = `<button class="btn ${rep ? "" : "gold"}" data-act="aiReport" ${SAMPLE && rows.length ? "" : "disabled"}>${rep ? "Write a new report" : "Write my insight report"}</button>`;
    if (!rep) return `<section class="card"><span class="eyebrow gold">AI insight report</span><h2>Turn ${rows.length} responses into a report you can share</h2><p class="muted">Claude reads your charts, scores and open-text answers and writes an executive summary, key findings, themes and prioritised recommendations.</p><div class="row wrap">${btn}</div>${SAMPLE ? `<p class="hint">Your results, including open-text answers, are sent to Claude. Individual participants are never identified.</p>` : `<p class="hint">${aiOff()}</p>`}</section>`;
    const newer = rows.length - (rep.n || 0);
    const pri = (p) => (p === "high" ? "warn" : p === "low" ? "good" : "info");
    return `<section class="card rep-head"><span class="eyebrow gold">AI insight report · ${fmtDate(rep.generatedAt)} · ${rep.n} responses</span><h2>${esc(rep.headline)}</h2><p>${esc(rep.summary)}</p>${newer > 0 ? `<p class="callout">${newer} new response${newer === 1 ? "" : "s"} since this report. Write a new one to include them.</p>` : ""}<div class="row wrap">${btn}</div></section>
      <div class="split">
        <section class="card"><h2>Key findings</h2><ol class="findings">${(rep.findings || []).map((f) => `<li><b>${esc(f.title)}</b><p>${esc(f.detail)}</p></li>`).join("")}</ol></section>
        <section class="card"><h2>Recommendations</h2><div>${(rep.recommendations || []).map((r) => `<div class="rec"><span class="tag ${pri(r.priority)}">${esc(r.priority || "medium")}</span><div><b>${esc(r.action)}</b><p>${esc(r.why)}</p><button class="btn small" style="margin-top:6px" data-act="toAction" data-title="${esc(r.action)}" data-why="${esc(r.why)}" data-pri="${esc(r.priority || "medium")}">Turn into action</button></div></div>`).join("")}</div></section>
      </div>
      ${(rep.themes || []).length ? `<section class="card"><h2>Themes in open-text answers</h2><div class="table-wrap" tabindex="0"><table><thead><tr><th>Theme</th><th>How common</th><th>Example</th></tr></thead><tbody>${rep.themes.map((t) => `<tr><td><b>${esc(t.theme)}</b></td><td>${esc(t.share)}</td><td class="muted">${esc(t.quote)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
      ${(rep.caveats || []).length ? `<section class="card"><h2>Read with care</h2><ul class="steps">${rep.caveats.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></section>` : ""}`;
  }
  async function runReport() {
    const st = studyById(S.resultsId); if (!st || !SAMPLE) return;
    const rows = currentRows(st);
    S.aiBusy = st.id; render();
    aiCtl = new AbortController();
    const prompt = `You are a senior research analyst at Afrimetrica writing for a busy client. Using only the survey data below, write an insight report.
Reply with only JSON in this shape:
{"headline": "one sentence, the single most important finding", "summary": "3-4 sentence executive summary with numbers", "findings": [{"title": "short", "detail": "1-2 sentences with numbers"}], "themes": [{"theme": "short name", "share": "e.g. about 40% of comments", "quote": "a short paraphrase or quote"}], "recommendations": [{"action": "specific action", "why": "the evidence", "priority": "high" | "medium" | "low"}], "caveats": ["limits such as small groups or sample size"]}
Give 4-6 findings, up to 5 themes (only if there are open-text answers), and 3-5 recommendations. Each recommendation should say how to measure whether it worked. Plain English. Do not invent data. Never describe a group of fewer than ${MIN_GROUP} people.

Survey data:
${richSummary(st, rows)}`;
    try {
      const r = await SAMPLE.json(prompt, { signal: aiCtl.signal, modelTier: "complex" });
      const A = (x) => (Array.isArray(x) ? x : []);
      const T = (x, n) => String(x == null ? "" : x).slice(0, n);
      const rep = { headline: T(r.headline, 300), summary: T(r.summary, 1500), generatedAt: Date.now(), n: rows.length,
        findings: A(r.findings).slice(0, 8).map((f) => ({ title: T(f && f.title, 160), detail: T(f && f.detail, 600) })),
        themes: A(r.themes).slice(0, 6).map((t) => ({ theme: T(t && t.theme, 100), share: T(t && t.share, 60), quote: T(t && t.quote, 300) })),
        recommendations: A(r.recommendations).slice(0, 6).map((x) => ({ action: T(x && x.action, 240), why: T(x && x.why, 500), priority: ["high", "medium", "low"].includes(x && x.priority) ? x.priority : "medium" })),
        caveats: A(r.caveats).slice(0, 5).map((c) => T(c, 300)) };
      S.reports[st.id] = rep; S.aiBusy = null; aiCtl = null;
      await save(() => backend.putStudy({ ...clone(studyById(st.id)), aiReport: rep, updatedAt: Date.now() }), "Insight report saved.");
    } catch (e) { S.aiBusy = null; aiCtl = null; aiError(e, "Claude couldn't write the report this time. Try again."); render(); }
  }

  function qCard(q, i) {
    const n = S.draft.questions.length;
    const choice = q.type === "single" || q.type === "multi" || q.type === "likert";
    const lkKey = Object.keys(LIKERT).find((k) => LIKERT[k][1].join("|") === q.options.join("|"));
    return `
    <article class="card">
      <div class="q-top">
        <span class="q-num">Q${i + 1}</span>
        <select id="q-${q.id}-type" data-q="${i}" data-k="type" aria-label="Question type">${Object.entries(QTYPES).map(([k, v]) => `<option value="${k}"${k === q.type ? " selected" : ""}>${v}</option>`).join("")}</select>
        <div class="row">
          <button class="icon" data-act="qmove" data-i="${i}" data-d="-1" aria-label="Move question up" ${i === 0 ? "disabled" : ""}>↑</button>
          <button class="icon" data-act="qmove" data-i="${i}" data-d="1" aria-label="Move question down" ${i === n - 1 ? "disabled" : ""}>↓</button>
          <button class="btn small danger" data-act="qdel" data-i="${i}" ${n === 1 ? "disabled" : ""}>Remove</button>
        </div>
      </div>
      <input id="q-${q.id}-text" data-q="${i}" data-k="text" value="${esc(q.text)}" placeholder="Type your question" aria-label="Question ${i + 1} text">
      ${q.type === "likert" ? `<label for="q-${q.id}-lp">Scale<select id="q-${q.id}-lp" data-q="${i}" data-k="likertPreset">${Object.entries(LIKERT).map(([k, [name]]) => `<option value="${k}"${k === lkKey ? " selected" : ""}>${name}</option>`).join("")}<option value=""${lkKey ? "" : " selected"}>Custom labels</option></select></label>` : ""}
      ${choice ? `<label for="q-${q.id}-opts">${q.type === "likert" ? "Scale labels, lowest to highest, one per line" : "Answer options, one per line"}<textarea id="q-${q.id}-opts" data-q="${i}" data-k="options" rows="${Math.max(3, q.options.length)}">${esc(q.options.join("\n"))}</textarea></label>` : ""}
      ${q.type === "likert" ? `<p class="hint">Scored 1 to ${q.options.length} from the first label to the last. Results show the average score and the top-2 box.</p>` : ""}
      ${q.type === "rating" ? ratingEditor(q, i) : ""}
      ${q.type === "number" ? `<p class="hint">Results show the average, median and range.</p>` : ""}
      <label class="inline" for="q-${q.id}-req"><input type="checkbox" id="q-${q.id}-req" data-q="${i}" data-k="required" ${q.required ? "checked" : ""}>Required</label>
    </article>`;
  }
  function ratingEditor(q, i) {
    const s = scaleOf(q), key = s.min + "-" + s.max;
    const known = SCALES.some(([a, b]) => a + "-" + b === key);
    const id = "q-" + q.id;
    return `<div class="scale-edit">
      <label for="${id}-sp">Scale<select id="${id}-sp" data-q="${i}" data-k="scalePreset">${SCALES.map(([a, b]) => `<option value="${a}-${b}"${a + "-" + b === key ? " selected" : ""}>${a} to ${b}${a === 0 && b === 10 ? " (Net Promoter)" : ""}</option>`).join("")}<option value="custom"${known ? "" : " selected"}>Custom range</option></select></label>
      <div class="grid2" style="gap:8px"><label for="${id}-smin">From<input id="${id}-smin" type="number" min="0" max="1" step="1" data-q="${i}" data-k="smin" value="${s.min}"></label><label for="${id}-smax">To<input id="${id}-smax" type="number" min="2" max="10" step="1" data-q="${i}" data-k="smax" value="${s.max}"></label></div>
      <label for="${id}-slo">Label for the lowest point<input id="${id}-slo" data-q="${i}" data-k="slo" value="${esc(s.minLabel)}" maxlength="60" placeholder="e.g. Not at all likely"></label>
      <label for="${id}-shi">Label for the highest point<input id="${id}-shi" data-q="${i}" data-k="shi" value="${esc(s.maxLabel)}" maxlength="60" placeholder="e.g. Extremely likely"></label>
    </div>`;
  }
  function updateCost() {
    const d = S.draft, h = hourly(d), pay = d.target * d.reward, fee = pay * FEE;
    const hEl = $("#hourly");
    if (hEl) hEl.innerHTML = `Participants earn <b class="num">${money(h)}</b> per hour. ` + (h < MIN_HOURLY ? `<span class="warn">This is below the $${MIN_HOURLY}/hour minimum. Raise the reward to at least ${money((MIN_HOURLY * d.minutes) / 60)}.</span>` : `<span class="ok">Fair pay.</span>`);
    const c = $("#costBox");
    if (c) c.innerHTML = `<h2>Cost to run</h2>
      <div class="cost-row"><span>Participant rewards (${int(d.target)} × ${money(d.reward)})</span><span>${money(pay)}</span></div>
      <div class="cost-row"><span>Afrimetrica fee (${Math.round(FEE * 100)}%)</span><span>${money(fee)}</span></div>
      <div class="cost-total"><span>Total</span><b>${money(pay + fee)}</b></div>`;
  }
  function problems(d) {
    const p = [];
    if (!d.title.trim()) p.push("Give the study a title.");
    if (!d.questions.length) p.push("Add at least one question.");
    d.questions.forEach((q, i) => {
      if (!q.text.trim()) p.push(`Question ${i + 1} has no text.`);
      if ((q.type === "single" || q.type === "multi" || q.type === "likert") && q.options.length < 2) p.push(`Question ${i + 1} needs at least two answer options.`);
      if (q.type === "rating") { const s = scaleOf(q); if (!(s.min === 0 || s.min === 1) || !(Number.isInteger(s.max) && s.max >= 2 && s.max <= 10)) p.push(`Question ${i + 1}: a rating scale must start at 0 or 1 and end between 2 and 10.`); }
    });
    if (!(d.target >= 1)) p.push("Set at least 1 participant.");
    if (!(d.minutes >= 1)) p.push("Set how many minutes the study takes.");
    if (!(d.reward > 0)) p.push("Set a reward above $0.");
    if (d.screen.minAge > d.screen.maxAge) p.push("The minimum age is higher than the maximum age.");
    return p;
  }
  async function saveStudy(status) {
    const d = S.draft;
    if (status === "live") {
      const p = problems(d);
      if (p.length) { $("#errs").innerHTML = `<div class="errs" role="alert"><b>Fix these before launching:</b><ul>${p.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`; return; }
    }
    const st = clone(d);
    Object.assign(st, { status, ownerId: d.ownerId || S.uid, createdAt: d.createdAt || Date.now(), updatedAt: Date.now(), target: Math.floor(+d.target) || 1, minutes: +d.minutes || 1, reward: Math.round((+d.reward || 0) * 100) / 100 });
    if (status === "live") st.launchedAt = Date.now();
    const ok = await save(() => backend.putStudy(st), status === "live" ? "Study launched. Eligible participants can see it now." : "Draft saved.");
    if (ok) { S.draft = null; S.importNote = null; ls.del("cohortly-draft"); go("studies"); }
  }

      <header class="card"><span class="eyebrow">Study</span><h1>${esc(st.title)}</h1><p class="muted">${esc(st.description)}</p><div class="meta-row"><span>About ${st.minutes} min</span><span>${money(st.reward)} reward</span><span>${qs.length} questions</span></div></header>
      <form id="takeForm" class="stack" novalidate>
        ${qs.map(qField).join("")}
        <div id="takeErr"></div>
        <button class="btn primary big" type="submit">Submit answers</button>
      </form></div>`;
  }
  function qField(q, i) {
    const name = "a_" + q.id;
    const legend = `<legend>${i + 1}. ${esc(q.text)}${q.required ? ` <span class="req" aria-label="required">*</span>` : ""}</legend>`;
    let body = "";
    if (q.type === "single" || q.type === "multi") {
      const t = q.type === "single" ? "radio" : "checkbox";
      body = `<div class="opts">${q.options.map((o, j) => `<label class="opt" for="${name}-${j}"><input type="${t}" id="${name}-${j}" name="${name}" value="${esc(o)}">${esc(o)}</label>`).join("")}</div>`;
    } else if (q.type === "rating") {
      const s = scaleOf(q), pts = [];
      for (let k = s.min; k <= s.max && pts.length < 11; k++) pts.push(k);
      body = `<div><div class="scale" style="--n:${pts.length}">${pts.map((n) => `<label class="opt" for="${name}-${n}"><input type="radio" id="${name}-${n}" name="${name}" value="${n}">${n}</label>`).join("")}</div><div class="scale-ends"><span>${s.min}${s.minLabel ? " · " + esc(s.minLabel) : ""}</span><span>${s.max}${s.maxLabel ? " · " + esc(s.maxLabel) : ""}</span></div></div>`;
    } else if (q.type === "likert") {
      body = `<div class="scale likert" style="--n:${q.options.length}">${q.options.map((o, j) => `<label class="opt" for="${name}-${j}"><input type="radio" id="${name}-${j}" name="${name}" value="${esc(o)}">${esc(o)}</label>`).join("")}</div>`;
    } else if (q.type === "number") {
      body = `<input type="number" step="any" id="${name}" name="${name}" inputmode="decimal" aria-label="Your answer">`;
    } else {
      body = `<textarea id="${name}" name="${name}" rows="3" maxlength="1000" aria-label="Your answer"></textarea>`;
    }
    return `<fieldset class="card">${legend}${body}</fieldset>`;
  }
  async function submitTake(form) {
    const st = studyById(S.taking); if (!st) return;
    const fd = new FormData(form), ans = {}, missing = [];
    takeQuestions(st).forEach((q, i) => {
      const name = "a_" + q.id; let v;
      if (q.type === "multi") v = fd.getAll(name);
      else if (q.type === "rating") v = fd.get(name) ? +fd.get(name) : null;
      else if (q.type === "number") { const raw = String(fd.get(name) || "").trim(); v = raw === "" || isNaN(+raw) ? null : +raw; }
      else v = fd.get(name) ? String(fd.get(name)).trim() : null;
      const empty = v == null || v === "" || (Array.isArray(v) && !v.length);
      if (q.required && empty) missing.push(i + 1);
      if (!empty) ans[q.id] = v;
    });
    if (missing.length) { $("#takeErr").innerHTML = `<div class="errs" role="alert">Please answer question${missing.length > 1 ? "s" : ""} ${missing.join(", ")}.</div>`; return; }
    const rid = st.id + "-" + S.uid;
    if (S.responses.some((r) => r.id === rid)) { toast("You have already taken this study."); S.taking = null; render(); return; }
    if (usedSlots(st.id) >= st.target) { toast("This study just filled up. Thanks for trying."); S.taking = null; render(); return; }
    const dur = (Date.now() - S.takeStart) / 1000;
    const passed = !st.attention || ans.attn === "Purple";
    const speeder = dur < st.minutes * 60 * 0.3;
    delete ans.attn;
    const p = S.profile || {};
    const r = { id: rid, studyId: st.id, ownerId: st.ownerId, participantId: S.uid, answers: ans, passedAttention: passed, speeder, status: passed && !speeder ? "approved" : "flagged", reward: st.reward, durationSec: Math.round(dur), demographics: { age: p.age, gender: p.gender, country: p.country, occupation: p.occupation }, createdAt: Date.now(), test: st.ownerId === S.uid };
    const ok = await save(() => backend.putResponse(r));
    if (ok) { S.taking = null; S.justDone = r; render(); window.scrollTo(0, 0); }
  }

  // ---------- RESULTS ----------
  function summarise(q, rows) {
    const vals = rows.map((r) => r.answers && r.answers[q.id]).filter((v) => v != null && v !== "");
    const n = rows.length;
    if (q.type === "single" || q.type === "multi") {
      const counts = new Map(q.options.map((o) => [o, 0]));
      vals.forEach((v) => (Array.isArray(v) ? v : [v]).forEach((x) => counts.set(x, (counts.get(x) || 0) + 1)));
      const max = Math.max(1, ...counts.values());
      return `<div class="bars">${[...counts].map(([o, c]) => barRow(o, c, pct(c, n), (c / max) * 100)).join("")}</div>${q.type === "multi" ? `<p class="hint">People could choose more than one answer, so totals can pass 100%.</p>` : ""}`;
    }
    if (q.type === "rating") {
      const s = scaleOf(q), nums = vals.map(Number).filter((x) => !isNaN(x));
      const mean = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
      const pts = []; for (let k = s.min; k <= s.max && pts.length < 11; k++) pts.push(k);
      const counts = pts.map((k) => nums.filter((x) => x === k).length);
      const max = Math.max(1, ...counts);
      const lab = (k) => (k === s.min && s.minLabel ? `${k} · ${s.minLabel}` : k === s.max && s.maxLabel ? `${k} · ${s.maxLabel}` : String(k));
      let extra = "";
      if (s.min === 0 && s.max === 10 && nums.length) {
        const pro = nums.filter((x) => x >= 9).length, det = nums.filter((x) => x <= 6).length, nps = Math.round(((pro - det) / nums.length) * 100);
        extra = `<p class="hint">Net Promoter Score <b class="num">${nps > 0 ? "+" : ""}${nps}</b> · ${pct(pro, nums.length)}% promoters (9–10) · ${pct(det, nums.length)}% detractors (0–6)</p>`;
      }
      return `<div class="row" style="align-items:baseline;gap:8px"><span class="bigstat">${nums.length ? mean.toFixed(2) : "–"}</span><span class="muted">average on a ${s.min}–${s.max} scale</span></div>${extra}<div class="bars">${pts.map((k, j) => barRow(lab(k), counts[j], pct(counts[j], nums.length), (counts[j] / max) * 100)).join("")}</div>`;
    }
    if (q.type === "likert") {
      const n = q.options.length, counts = q.options.map((o) => vals.filter((v) => v === o).length);
      const tot = counts.reduce((a, b) => a + b, 0), max = Math.max(1, ...counts);
      const mean = tot ? counts.reduce((a, c, j) => a + c * (j + 1), 0) / tot : 0;
      const top2 = tot ? pct(counts.slice(-2).reduce((a, b) => a + b, 0), tot) : 0;
      return `<div class="row wrap" style="align-items:baseline;gap:8px"><span class="bigstat">${tot ? mean.toFixed(2) : "–"}</span><span class="muted">average score out of ${n} (1 = ${esc(q.options[0])})</span></div><p class="hint">Top-2 box: <b class="num">${top2}%</b> chose one of the two highest points.</p><div class="bars">${q.options.map((o, j) => barRow(o, counts[j], pct(counts[j], tot), (counts[j] / max) * 100)).join("")}</div>`;
    }
    if (q.type === "number") {
      const nums = vals.map(Number).filter((x) => !isNaN(x));
      if (!nums.length) return `<p class="muted">No answers yet.</p>`;
      const mean = nums.reduce((a, b) => a + b, 0) / nums.length;
      const f = (x) => (+x).toLocaleString("en-US", { maximumFractionDigits: 2 });
      return `<dl class="kv"><dt>Average</dt><dd class="num">${f(mean)}</dd><dt>Median</dt><dd class="num">${f(median(nums))}</dd><dt>Lowest</dt><dd class="num">${f(Math.min(...nums))}</dd><dt>Highest</dt><dd class="num">${f(Math.max(...nums))}</dd></dl>`;
    }
    const recent = vals.slice(-8).reverse();
    return recent.length ? `<ul class="quotes">${recent.map((v) => `<li>${esc(v)}</li>`).join("")}</ul>${vals.length > 8 ? `<p class="hint">Showing the 8 newest of ${int(vals.length)} answers. Export CSV to read them all.</p>` : ""}` : `<p class="muted">No answers yet.</p>`;
  }
  const barRow = (label, count, share, width) => `<div class="br"><span class="br-l">${esc(label)}</span><span class="br-t"><i style="width:${width.toFixed(1)}%"></i></span><span class="br-v">${int(count)} · ${share}%</span></div>`;
  function demoBars(rows, key, order) {
    const counts = new Map((order || []).map((o) => [o, 0]));
    rows.forEach((r) => { const d = r.demographics || {}; const v = key === "age" ? ageBand(d.age) : d[key] || "Unknown"; counts.set(v, (counts.get(v) || 0) + 1); });
    let entries = [...counts].filter(([, c]) => c > 0 || order);
    const tiny = entries.filter(([, c]) => c > 0 && c < 3);
    if (tiny.length) { entries = entries.filter(([, c]) => !(c > 0 && c < 3)); entries.push(["Smaller groups", tiny.reduce((a, [, c]) => a + c, 0)]); }
    const max = Math.max(1, ...entries.map(([, c]) => c));
    return `<div class="bars">${entries.map(([o, c]) => barRow(o, c, pct(c, rows.length), (c / max) * 100)).join("")}</div>`;
  }
  function ageBand(a) { a = +a; if (!a) return "Unknown"; if (a < 25) return "18–24"; if (a < 35) return "25–34"; if (a < 45) return "35–44"; if (a < 55) return "45–54"; if (a < 65) return "55–64"; return "65+"; }
  function viewResults() {
    if (S.mode === "loading") return loading();

    const tabs = [["summary", "Dashboard"], ["quality", "Data quality"], ["insights", "Insights"], ["patterns", "Hidden patterns"], ["compare", "Compare groups"], ["drivers", "Key drivers"], ["stats", "Statistics studio"], ["analyst", "AI analyst"], ["report", "AI report"], ["actions", "Actions"]];
    if (!tabs.some(([k]) => k === S.anTab)) S.anTab = "summary";

    const noRows = `<div class="empty"><h2>No responses to analyse${S.filter.key || +S.filter.days ? " with this filter" : " yet"}</h2><p class="muted">${S.filter.key || +S.filter.days ? "Clear or change the filter to see more responses." : `Insights appear once people answer${S.excludeFlagged && all.length ? ". Untick “approved responses only” to include responses waiting for review" : ""}.`}</p></div>`;
    const need = (fn) => (rows.length ? fn(st, rows) : noRows);
    let body;
    switch (S.anTab) {
      case "quality": body = viewQuality(st); break;
      case "insights": body = need(viewInsights); break;
      case "patterns": body = need(viewPatterns); break;
      case "compare": body = need(viewCompare); break;
      case "drivers": body = need(viewDrivers); break;
      case "stats": body = need(viewStudio); break;
      case "analyst": body = need(viewAnalyst); break;

    return head(picker) + `
      <section class="kpis">
        ${kpi(`${int(usedSlots(st.id))}<span class="muted" style="font-size:1rem"> / ${int(st.target)}</span>`, "Responses")}
        ${kpi(int(approved.length), "Approved")}
        ${kpi(int(flagged.length), "Waiting for review")}

  }
  function reviewQueue(flagged) {
