  // ================= ANALYZE · DECISION INTELLIGENCE =================
  const MIN_GROUP = 3; // groups smaller than this are never shown on their own, to protect anonymity
  /*STAT-START*/
  const STAT = (() => {
    const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
    const variance = (a) => { if (a.length < 2) return 0; const m = mean(a); return a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1); };

    const quant = (s, p) => { if (!s.length) return NaN; const i = (s.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i); return s[lo] + (s[hi] - s[lo]) * (i - lo); };
    function lgamma(x) { const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5]; let y = x, t = x + 5.5; t -= (x + 0.5) * Math.log(t); let ser = 1.000000000190015; for (let j = 0; j < 6; j++) ser += c[j] / ++y; return -t + Math.log((2.5066282746310005 * ser) / x); }
    function betacf(x, a, b) {
      const FP = 1e-300; const qab = a + b, qap = a + 1, qam = a - 1; let c = 1, d = 1 - (qab * x) / qap; if (Math.abs(d) < FP) d = FP; d = 1 / d; let h = d;
      for (let m = 1; m <= 300; m++) { const m2 = 2 * m; let aa = (m * (b - m) * x) / ((qam + m2) * (a + m2)); d = 1 + aa * d; if (Math.abs(d) < FP) d = FP; c = 1 + aa / c; if (Math.abs(c) < FP) c = FP; d = 1 / d; h *= d * c;
        aa = (-(a + m) * (qab + m) * x) / ((a + m2) * (qap + m2)); d = 1 + aa * d; if (Math.abs(d) < FP) d = FP; c = 1 + aa / c; if (Math.abs(c) < FP) c = FP; d = 1 / d; const del = d * c; h *= del; if (Math.abs(del - 1) < 3e-14) break; }
      return h;
    }
    function ibeta(x, a, b) { if (x <= 0) return 0; if (x >= 1) return 1; const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x)); return x < (a + 1) / (a + b + 2) ? (bt * betacf(x, a, b)) / a : 1 - (bt * betacf(1 - x, b, a)) / b; }
    function gammaP(a, x) {
      if (x <= 0) return 0;
      if (x < a + 1) { let sum = 1 / a, del = sum, ap = a; for (let n = 0; n < 1000; n++) { ap++; del *= x / ap; sum += del; if (Math.abs(del) < Math.abs(sum) * 3e-14) break; } return sum * Math.exp(-x + a * Math.log(x) - lgamma(a)); }

  const TYPE_BY_LABEL = Object.fromEntries(Object.entries(QTYPES).map(([k, v]) => [v.toLowerCase(), k]));
  async function readExcelFile(file) {
    await loadScript(EXCELJS);
    const wb = new window.ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
    const cellText = (c) => { const v = c && c.value; if (v == null) return ""; if (typeof v === "object") return String(v.richText ? v.richText.map((t) => t.text).join("") : v.result != null ? v.result : v.text || ""); return String(v); };
    const qs = wb.worksheets.find((w) => /^questions$/i.test(w.name.trim()));
    if (qs) {
      let hr = 0, cQ = 0, cT = 0, cO = 0, cR = 0;
      qs.eachRow((row, n) => { if (hr) return; row.eachCell((c, k) => { const t = cellText(c).toLowerCase(); if (t === "question") cQ = k; if (t === "type") cT = k; if (/answer options|options/.test(t)) cO = k; if (t === "required") cR = k; }); if (cQ) hr = n; });
      if (cQ) {
        const out = [];
        qs.eachRow((row, n) => {
          if (n <= hr) return;
          const text = cellText(row.getCell(cQ)).trim(); if (!text) return;
          const type = TYPE_BY_LABEL[cellText(row.getCell(cT)).trim().toLowerCase()] || "text";
          const opt = cO ? cellText(row.getCell(cO)).trim() : "";
          const q = { type, text, options: [], required: !cR || !/^no$/i.test(cellText(row.getCell(cR)).trim()) };
          if (type === "rating") { const m = opt.match(/^(\d+)\s*[–-]\s*(\d+)(?:\s*·\s*(.*?)\s*…\s*(.*))?$/); q.scale = m ? { min: +m[1], max: +m[2], minLabel: m[3] || "", maxLabel: m[4] || "" } : defScale(); }
          else if (type === "single" || type === "multi" || type === "likert") q.options = opt.split(/\s*\|\s*|\n/).map((s) => s.trim()).filter(Boolean);
          out.push(q);
        });
        const title = (() => { const s = wb.worksheets.find((w) => /^survey$/i.test(w.name.trim())); return s ? cellText(s.getCell("A1")).trim() : ""; })();
        return { exact: true, title, questions: normAIQs(out) };
      }
    }
    const lines = [];

  }

  async function sendF2FRequest() {

    const F = S.f2f, sv = f2fSurvey(), q = f2fQuote(F, sv);
    const inputs = { method: F.method, n: q.n, groups: F.groups, perGroup: F.perGroup, country: F.country, setting: F.setting, audience: F.audience, capture: F.capture, minutes: q.mins, languages: F.languages, backTranslation: !!F.backTranslation, record: !!F.record, transcription: !!F.transcription, incentive: +F.incentive || 0, report: F.report, urgency: F.urgency };
    const r = { id: newId("fw"), ref: F.ref, requesterId: S.uid, status: "new", createdAt: Date.now(), contact, inputs, survey: sv ? { title: sv.title || "", questions: sv.questions.length, source: sv.source, list: sv.questions.slice(0, 150).map((x) => ({ type: x.type, text: x.text.slice(0, 300), options: (x.options || []).slice(0, 20) })) } : null, quote: { total: q.total, per: q.per, weeks: q.weeks, lines: q.lines } };
    const ok = await save(() => backend.putFieldwork(r), "Request sent. We'll be in touch within 2 working days.");

  async function exportQuoteXlsx() {

    try {
      const wb = await xlBook();
      const ws = xlSheet(wb, "Quote", `Fieldwork quote ${S.f2f.ref || ""}`, `Afrimetrica · ${F2F_METHODS[F.method]} · ${new Date().toLocaleDateString("en-US", { dateStyle: "medium" })} · valid 30 days · US dollars`);
      xlRows(ws, [["Survey", sv ? sv.title : "Not uploaded"], ["Method", F2F_METHODS[F.method]], ["Country and setting", `${F.country}, ${SETTING[F.setting][0].toLowerCase()}`], ["Audience", AUDIENCE[F.audience][0]], ["Minutes per " + (F.method === "fgd" ? "group" : "interview"), q.mins], ["Estimated timeline", `About ${q.weeks} week${q.weeks > 1 ? "s" : ""} (${q.fieldDays} day${q.fieldDays > 1 ? "s" : ""} of fieldwork)`]], (r) => (r.getCell(1).font = { bold: true, color: { argb: XL.navy } }));

      const first = ws.rowCount + 1;
      q.lines.forEach((l) => { const r = ws.addRow([l.label, l.group, l.qty, l.unit, null]); r.getCell(5).value = { formula: `C${r.number}*D${r.number}`, result: l.amount }; r.getCell(4).numFmt = r.getCell(5).numFmt = '"$"#,##0.00'; });
      const last = ws.rowCount;
      const t = ws.addRow(["Total", "", "", "", { formula: `SUM(E${first}:E${last})`, result: q.total }]); t.font = { bold: true, color: { argb: XL.navy } }; t.getCell(5).numFmt = '"$"#,##0.00';
      t.eachCell((c) => (c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XL.goldSoft } }));
      const p = ws.addRow([`Per ${F.method === "fgd" ? "participant" : "interview"}`, "", q.resp, "", { formula: `E${t.number}/C${t.number + 1}`, result: q.per }]); p.getCell(5).numFmt = '"$"#,##0.00';

      xlWidths(ws, [62, 16, 10, 14, 16]);

      await xlSave(wb, `fieldwork-quote-${(S.f2f.ref || "draft").toLowerCase()}.xlsx`);
    } catch (e) { toast("The quote couldn't be exported."); }
    xlBusy(false);
  }

  async function submitEnquiry(type) {
    const v = (k) => { const el = $(`#eq-${type}-${k}`); return el ? (el.value || "").trim() : ""; };
    const checks = [["name", !v("name"), "Enter your name."], ["email", !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("email")), "Enter a valid email address."],
      ["msg", v("msg").length < 5, "Tell us a little about what you need."], ["ok", !$(`#eq-${type}-ok`).checked, "Tick the box so we can contact you."]];
    const errId = `eq-${type}-err`, errs = checks.filter(([, bad]) => bad);
    // Mark each field: invalid ones point to the error summary; fixed ones are cleared.
    for (const [k, bad] of checks) { const el = $(`#eq-${type}-${k}`); if (!el) continue; if (bad) { el.setAttribute("aria-invalid", "true"); el.setAttribute("aria-describedby", errId); } else { el.removeAttribute("aria-invalid"); el.removeAttribute("aria-describedby"); } }
    if (errs.length) { $(`#${errId}`).innerHTML = `<div class="errs" role="alert"><b>Please check ${errs.length === 1 ? "this" : "these"}:</b><ul>${errs.map(([, , m]) => `<li>${esc(m)}</li>`).join("")}</ul></div>`; $(`#eq-${type}-${errs[0][0]}`).focus(); return; }
    $(`#${errId}`).innerHTML = "";
    const item = { id: newId("eq"), type, requesterId: S.uid, status: "new", createdAt: Date.now(),
      contact: { name: v("name"), email: v("email").toLowerCase(), phone: v("phone"), organisation: v("org") },
      subject: v("subject"), message: v("msg"), details: { service: v("service"), timeline: v("timeline"), budget: v("budget") } };
    const ok = await save(() => backend.putPriv("enquiries", item), "Thank you. Your enquiry has been sent.");
    if (ok) { S.enqSent[type] = true; render(); }
  }

  function viewResources() {

    const tpl = Object.entries(TEMPLATES);
    return `<div class="page-head"><div><span class="eyebrow gold">Afrimetrica Insights</span><h1>Insights for better research</h1><p class="muted" style="max-width:66ch">Free guides, a sample size calculator, ready-made survey templates, published findings and links to open data.</p></div></div>

        <div class="grid4"><label for="sc-conf">Confidence<select id="sc-conf"><option value="1.645">90%</option><option value="1.96" selected>95%</option><option value="2.576">99%</option></select></label>
        <label for="sc-moe">Margin of error (±%)<input id="sc-moe" type="number" min="1" max="20" step="0.5" value="5"></label>
        <label for="sc-pop">Population (blank = large)<input id="sc-pop" type="number" min="1" step="1" placeholder="e.g. 3000"></label>
        <label for="sc-rr">Expected response rate (%)<input id="sc-rr" type="number" min="1" max="100" step="1" value="100"></label></div>
        <div class="calc-out" id="sc-out" aria-live="polite">${calcSample()}</div></section>

        <div class="course-grid">${tpl.map(([k, t]) => `<article class="card"><h3>${esc(t.name)}</h3><p class="muted">${esc(t.blurb)}</p><span class="hint">${t.questions.length} questions</span><div class="row wrap"><button class="btn small" data-act="tplXl" data-key="${k}">Download Excel</button><button class="btn small ghost" data-act="tpl" data-key="${k}">Use in Afrimetrica Surveys</button></div></article>`).join("")}</div></section>
      <section class="stack"><h2>Published findings and open data</h2>${libraryBody()}</section>`;
  }
  function calcSample() {
    const g = (id, d) => { const el = $(id); return el ? el.value : d; };
    const z = +g("#sc-conf", 1.96), e = (+g("#sc-moe", 5) || 5) / 100, N = Math.floor(+g("#sc-pop", 0) || 0), rr = Math.min(100, Math.max(1, +g("#sc-rr", 100) || 100)) / 100;
    const n = sampleN(z, e, N);
    return `<div><span class="hint">Completed responses needed</span><b>${int(n)}</b></div><div><span class="hint">People to invite at a ${Math.round(rr * 100)}% response rate</span><b>${int(Math.ceil(n / rr))}</b></div>`;
  }

rd"}</dd><dt>Email</dt><dd>${unverified() ? `<span class="warn">Not confirmed</span> <button class="linkbtn" data-act="resendVerifyAcct">Send link again</button>` : "Confirmed"}</dd></dl><div><button class="btn small ghost" data-act="signout">Sign out</button></div>` : `<p class="muted">On claude.ai, Afrimetrica uses your Claude account.</p>`}</section>`, participant: `<section class="card"><h2>Participant profile</h2><p class="muted">${S.profile ? `${esc(S.profile.age)} · ${esc(S.profile.gender)} · ${esc(S.profile.country)} · ${esc(S.profile.occupation)}` : "Set up a short profile to take paid surveys."}</p><a class="btn small" href="#panel" style="align-self:flex-start">${S.profile ? "Studies and earnings" : "Set up profile"}</a></section>` };

  async function readFile(file) {
    const name = file.name || "your file", ext = (name.split(".").pop() || "").toLowerCase();

          const tc = await (await pdf.getPage(p)).getTextContent();
          let line = "";
          for (const it of tc.items) { line += it.str; if (it.hasEOL) { lines.push(line); line = ""; } }
          if (line) lines.push(line);
        }
        if (lines.join("").replace(/\s/g, "").length < 20) { S.imp = { status: "error", file: name, error: "This PDF looks like a scanned image, so it has no text to read. Upload the original Word file or paste the questions instead." }; render(); return; }
      } else if (ext === "xlsx") {
        const x = await readExcelFile(file);
        if (x.exact) { S.imp = { status: "ready", method: "excel", file: name, title: x.title || name.replace(/\.[^.]+$/, ""), description: "", questions: x.questions, text: x.questions.map((q, i) => `${i + 1}. ${q.text}\n${q.options.join("\n")}`).join("\n") }; render(); return; }
        lines = x.lines;

    function walkList(list, depth) {
      for (const li of list.children) {
        if (li.tagName !== "LI") continue;
        const own = [...li.childNodes].filter((c) => !isList(c)).map((c) => c.textContent).join(" ").trim();
        if (own) out.push((list.tagName === "OL" && depth === 0 ? "\u0001" : "\u0002") + own);
        for (const sub of li.children) if (isList(sub)) walkList(sub, depth + 1);
      }
    }
    function walk(el) {
      for (const n of el.children) {
        if (isList(n)) walkList(n, 0);
        else if (n.tagName === "TABLE") n.querySelectorAll("tr").forEach((tr) => [...tr.children].forEach((td) => { const t = td.textContent.trim(); if (t) out.push(t); }));
        else if (/^H[1-6]$/.test(n.tagName)) { const t = n.textContent.trim(); if (t) out.push("\u0003" + t); }
        else if (n.tagName === "P") { n.textContent.split(/\n/).forEach((t) => { t = t.trim(); if (t) out.push(t); }); }
        else walk(n);
      }
    }
    walk(doc.body);
    return out;
  }

  const RX_NUM = /^\s*(?:Q(?:uestion)?\s*)?(\d{1,3})\s*[.):\-]\s*(.+)$/i;
  const RX_QN = /^\s*Q(?:uestion)?\s*(\d{1,3})\s+(.+)$/i;
  const RX_OPT = /^\s*(?:\(?[a-hA-H][).\]]|\((?:i|ii|iii|iv|v|vi|vii|viii)\)|(?:i|ii|iii|iv|v|vi|vii|viii)\)|[•●○◦▪■□☐❑◻▢⬜◯\-–—*·]|\[\s?\]|\(\s?\)|o(?=\s))\s*(.+)$/;
  const BOXES = /[□☐❑◻▢⬜○◯]/;
  const cleanQ = (t) => t.replace(/\s*[_.]{3,}\s*$/, "").replace(/\s+/g, " ").trim();
  const cleanOpt = (t) => t.replace(/[□☐❑◻▢⬜○◯]/g, "").replace(/^\s*(?:\(?[a-hA-H][).\]]|[•●◦▪■\-–—*·])\s+/, "").replace(/\s*[_.]{3,}\s*$/, "").replace(/[:\s]+$/, "").replace(/\s+/g, " ").trim();
  function inferType(q) {
    const t = q.text.toLowerCase(), o = q.options;
    if (o.length >= 2) {
      if (o.length >= 3 && o.every((x) => /^\d{1,2}$/.test(x))) {
        const ns = o.map(Number);
        if (ns.every((v, j) => j === 0 || v === ns[j - 1] + 1) && (ns[0] === 0 || ns[0] === 1) && ns[ns.length - 1] <= 10) { q.scale = { min: ns[0], max: ns[ns.length - 1] }; q.options = []; return "rating"; }
      }
      if (o.length >= 3 && o.every((x) => LIKERT_WORDS.test(x))) return "likert";
      if (/(all that apply|select all|tick all|check all|choose all|mark all|more than one|select (up to|any)|multiple answers)/.test(t)) return "multi";
      return "single";
    }
    q.options = [];
    const r = t.match(/\b([01])\s*(?:-|–|to)\s*(\d{1,2})\b/);
    if (r && /(scale|rate|rating|how likely|how satisfied|recommend|agree)/.test(t) && +r[2] >= 2 && +r[2] <= 10) { q.scale = { min: +r[1], max: +r[2] }; return "rating"; }
    if (/(on a scale|\brate\b|\brating\b)/.test(t)) return "rating";
    if (/\b(how many|how much|how old|your age|what is your age|number of|in years|amount)\b/.test(t) || /^age\b/.test(t)) return "number";
    return "text";
  }
  function parseQuestionnaire(raw, fallbackTitle) {
    const cleaned = raw.map((l) => String(l).replace(/[ \t ]+/g, " ").trim()).filter((l) => l.replace(/[\u0001-\u0003]/g, "").trim());
    const bare = (l) => /^\d{1,2}$/.test(l);
    // Drop page numbers ("Page 2", "2 of 5", or a lone number), but keep runs of bare numbers: those are scale options (1 2 3 4 5).
    const lines = cleaned.filter((l, i) => {
      if (/^[\u0001-\u0003]?page\s*\d+(\s*(of|\/)\s*\d+)?$/i.test(l) || /^\d+\s*(of|\/)\s*\d+$/i.test(l)) return false;
      if (bare(l)) return bare(cleaned[i - 1] || "") || bare(cleaned[i + 1] || "");
      return true;
    });
    const qs = [], pre = [];
    let cur = null, lastN = 0;
    const startQ = (text) => { cur = { text: cleanQ(text), options: [] }; qs.push(cur); };
    const addOpt = (text) => { const o = cleanOpt(text); if (o && cur.options.length < 30 && !cur.options.includes(o)) cur.options.push(o); };
    const optionLike = (text) => cur && text.length < 90 && !/\?\s*$/.test(text) && (cur.options.length > 0 || /[?:]\s*$/.test(cur.text) || /\((please )?(select|tick|choose|check|circle)/i.test(cur.text));
    for (let line of lines) {
      let kind = "";
      if (line[0] === "\u0001") { kind = "num"; line = line.slice(1).trim(); }
      else if (line[0] === "\u0002") { kind = "bullet"; line = line.slice(1).trim(); }
      else if (line[0] === "\u0003") { if (!qs.length) pre.push(line.slice(1).trim()); continue; }
      // "Do you smoke? ☐ Yes ☐ No" → question + inline options
      if (BOXES.test(line)) {
        const parts = line.split(BOXES).map((s) => s.trim());
        const headTxt = parts.shift(), opts = parts.filter(Boolean);
        if (opts.length >= 2 || (opts.length && cur && !headTxt)) {
          if (headTxt) { const m = headTxt.match(RX_NUM) || headTxt.match(RX_QN); if (m) lastN = +m[1]; startQ(m ? m[2] : headTxt); }
          if (cur) opts.forEach(addOpt);
          continue;
        }
      }
      if (kind === "bullet") { if (cur) addOpt(line); else pre.push(line); continue; }
      if (kind === "num") {
        const asOption = cur && !/\?/.test(line) && line.length < 60 && optionLike(line) && (!cur.options.length || cur.optSrc === "num");
        if (asOption) { addOpt(line); cur.optSrc = "num"; } else startQ(line);
        continue;
      }
      if (bare(line)) { if (cur) addOpt(line); continue; }
      const m = line.match(RX_NUM) || line.match(RX_QN);
      if (m && !/^\d+\s*[.)]\s*\d/.test(line)) {
        const n = +m[1];
        if (!cur || n === lastN + 1 || /\?\s*$/.test(m[2]) || !optionLike(m[2])) { startQ(m[2]); lastN = n; }
        else addOpt(m[2]);
        continue;
      }
      const o = line.match(RX_OPT);
      if (o && cur) { addOpt(o[1]); continue; }
      if (/\?\s*$/.test(line) && line.length > 8) { startQ(line); continue; }
      if (cur) {
        const scaleWord = line.length < 45 && !/\?/.test(line) && LIKERT_WORDS.test(line);
        if ((optionLike(line) || scaleWord) && line.length < 70 && !/\.\s*$/.test(line)) addOpt(line);
        else if (!cur.options.length && cur.text.length < 400) cur.text = cleanQ(cur.text + " " + line);
        continue;
      }
      pre.push(line);
    }
    const questions = qs.filter((q) => q.text.length > 2).slice(0, 150).map((q) => { const type = inferType(q); return { type, text: q.text.slice(0, 500), options: q.options, required: true, scale: q.scale }; });
    const t = pre.find((l) => l.length <= 120) || fallbackTitle;
    const description = pre.filter((l) => l !== t).join(" ").slice(0, 600);
    return { title: t.slice(0, 120), description, questions };
  }

  async function readWithAI() {
    const im = S.imp;
    if (!SAMPLE || !im.text) return;
    const prev = clone(im);
    S.imp = { ...im, status: "ai" }; render();
    aiCtl = new AbortController();
    const prompt = `You convert a questionnaire document into online survey questions.
Reply with only JSON in exactly this shape:
{"title": "string", "description": "string", "questions": [{"type": "single", "text": "string", "options": ["string"], "required": true}]}
Rules:
- type is one of: "single" (choose one answer), "multi" (choose all that apply), "rating" (a numbered scale such as 1–5, 1–7, 1–9, 1–10 or 0–10), "likert" (a labelled scale such as Strongly disagree … Strongly agree, Never … Always, Very dissatisfied … Very satisfied), "number" (asks for a number, amount or age), "text" (open answer).
- Keep each question's wording as written, without its number. Put answer choices in "options" without letters, bullets or numbers. Use [] for rating, number and text.
- For "likert", put the scale labels in "options" from lowest to highest.
- For "rating", add "scale": {"min": 0 or 1, "max": a whole number from 2 to 10, "minLabel": "label of the lowest point, or empty", "maxLabel": "label of the highest point, or empty"}.
- A grid or matrix (several statements rated on the same scale) becomes one question per statement, each with the same scale.
- Skip headings, instructions, consent text, thank-you notes, and questions asking for a name, email, phone number or address.
- "title" is the questionnaire's title. "description" is one or two sentences from its introduction, or "".

Document:
"""
${im.text.slice(0, 60000)}
"""`;
    try {
      const r = await SAMPLE.json(prompt, { signal: aiCtl.signal });
      const qs = normAIQs(r && r.questions);
      S.imp = { ...prev, status: "ready", method: "ai", title: String(r.title || prev.title || "").slice(0, 120) || prev.title, description: String(r.description || "").slice(0, 600), questions: qs };
    } catch (e) {
      const code = e && e.code;
      S.imp = { ...prev, status: "ready" };
      if (code === "not_granted" || code === "sampling_disabled") { SAMPLE = null; toast("AI reading is turned off for this page. The automatic result is shown."); }
      else if (code === "rate_limited") toast("You've used AI reading a lot recently. Try again later.");
      else if (code !== "cancelled") toast("Claude couldn't read the file this time. The automatic result is shown.");
    }
    aiCtl = null;
    render();
  }
  function openImported() {
    const im = S.imp;
    const d = draftFromTemplate(null);
    d.title = im.title || ""; d.description = im.description || "";
    d.questions = im.questions.map((q) => ({ ...mkQ(q.type, q.text, q.options, q.scale), required: q.required !== false }));
    d.minutes = Math.max(2, Math.round(d.questions.length * 0.6));
    d.reward = Math.ceil((MIN_HOURLY * 1.25 * d.minutes / 60) * 20) / 20;
    S.draft = d; saveDraftLocal();
    S.importNote = `Imported ${d.questions.length} questions from ${im.file}. Check each question's type and answer options, set your audience and pay, then launch. The time estimate and reward were set from the number of questions.`;
    S.imp = { status: "idle" };
    go("create");
  }

  // ---------- boot ----------
  async function boot() {
    route(); render();
    const c = window.claude;
    if (!c || typeof c.use !== "function") {
      if (/^https?:$/.test(location.protocol)) { try { const me = await api("GET", "/api/me"); if (me && me.uid) { await startServer(me); return; } } catch (e) {} }
      DL = browserDL; startDemo(); return;
    }
    let db = null, user = null;
    try { [db, user, DL, SAMPLE] = await Promise.all([c.use("db"), c.use("user"), c.use("downloads"), c.use("sample")]); } catch (e) {}
    if (S.view === "import" || S.view === "home" || S.view === "surveys" || S.view === "create" || S.view === "results") render();
    const uid = user ? await user.id() : null;
    if (!db || !uid) { startDemo(); return; }
    DB = db; S.uid = uid; S.isOwner = await user.isOwner();
    let gotStudies = false, gotResp = false;
    const timer = setTimeout(() => { S.stale = true; if (S.mode === "loading") S.mode = "live"; softRender(); }, 10000);
    const settle = (snap) => { if (!snap.metadata.fromCache && gotStudies && gotResp) { clearTimeout(timer); S.stale = false; } };
    const fail = (what) => (err) => { clearTimeout(timer); S.mode = "live"; S.notice = `Couldn't load ${what} (${err.code}). Reload the page to try again.`; softRender(); };
    DB.collection("studies").onSnapshot((snap) => { S.studies = snap.docs.map((d) => ({ ...d.data(), id: d.id })); gotStudies = true; if (gotResp) S.mode = "live"; settle(snap); softRender(); }, fail("studies"));
    DB.collection("fieldwork").limit(1000).onSnapshot((snap) => { S.fieldwork = snap.docs.flatMap((d) => (((d.data() || {}).requests) || []).map((r) => ({ ...r, requesterId: d.id }))); softRender(); }, () => {});
    DB.collection("courses").limit(500).onSnapshot((snap) => { S.courses = snap.docs.map((d) => ({ ...d.data(), id: d.id })); softRender(); }, () => {});
    DB.collection("settings").doc("contact").onSnapshot((d) => { S.settings = d.exists ? d.data() || {} : {}; softRender(); }, () => {});
    for (const coll of ["enquiries", "enrollments"]) DB.collection(coll).limit(1000).onSnapshot((snap) => { S[coll] = snap.docs.flatMap((d) => (((d.data() || {}).items) || []).map((x) => ({ ...x, [PRIV_KEY[coll]]: d.id }))); softRender(); }, () => {});
    DB.collection("actions").limit(1000).onSnapshot((snap) => { S.actions = snap.docs.map((d) => ({ ...d.data(), id: d.id })); softRender(); }, () => {});
    DB.collection("responses").limit(1000).onSnapshot((snap) => { S.responses = snap.docs.map((d) => ({ ...d.data(), id: d.id })); gotResp = true; if (gotStudies) S.mode = "live"; settle(snap); softRender(); }, fail("responses"));
    try { const p = await DB.doc("data/users/" + uid + "/profile").get(); if (p.exists) S.profile = p.data(); } catch (e) {}
    softRender();
  }
  boot();
})();
