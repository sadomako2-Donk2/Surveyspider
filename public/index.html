    const head = `<div class="qmeta"><div><span class="eyebrow">${im.method === "ai" ? "Read by Claude" : im.method === "excel" ? "Imported from a SurveySpider Excel file" : "Read automatically"}</span><h2>Found ${n} question${n === 1 ? "" : "s"} in ${esc(im.file)}</h2></div></div>`;
    const actions = `<div class="row wrap">${n ? `<button class="btn primary" data-act="impOpen">Open in study builder</button>` : ""}${SAMPLE && im.method !== "ai" ? `<button class="btn" data-act="impAI">Read again with AI</button>` : ""}<button class="btn ghost" data-act="impReset">Upload a different file</button></div>`;
    if (!n) return `<section class="card">${head}<p class="muted">No questions were recognised. Check that the questions are numbered or end with a question mark${SAMPLE ? ", or let Claude read the file" : ""}.</p>${actions}</section>`;
    return `<section class="card">${head}
      <dl class="kv"><dt>Title</dt><dd>${esc(im.title)}</dd>${im.description ? `<dt>Intro</dt><dd>${esc(im.description)}</dd>` : ""}</dl>
      ${actions}
      <ol class="found">${im.questions.map((q, i) => `<li><span class="q-num">Q${i + 1}</span><div><div>${esc(q.text)}</div>${q.options.length ? `<div class="opts-mini">${q.options.map((o) => `<span>${esc(o)}</span>`).join("")}</div>` : ""}</div><span class="pill">${esc(typeLabel(q))}</span></li>`).join("")}</ol>
      <p class="hint">You can fix any question type, wording or option in the next step.</p>
      ${actions}</section>`;
  }

  async function readFile(file) {
    const name = file.name || "your file", ext = (name.split(".").pop() || "").toLowerCase();
    if (file.size > 20 * 1024 * 1024) { S.imp = { status: "error", error: "That file is over 20 MB. Upload a smaller file or paste the questions instead." }; render(); return; }
    if (ext === "xls") { S.imp = { status: "error", error: "Older .xls files can't be read. In Excel, choose File › Save As › Excel Workbook (.xlsx), then upload that." }; render(); return; }
    if (ext === "doc") { S.imp = { status: "error", error: "Older .doc files can't be read. In Word, choose File › Save As › Word Document (.docx), then upload that." }; render(); return; }
    S.imp = { status: "reading", file: name }; render();
    try {
      let lines;
      if (ext === "docx") {
        await loadScript(LIBS.mammoth);
        const out = await window.mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
        lines = htmlToLines(out.value);
      } else if (ext === "pdf" || file.type === "application/pdf") {
        await loadScript(LIBS.pdfWorker); await loadScript(LIBS.pdf);
        const lib = window.pdfjsLib;
        const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
        lines = [];
        for (let p = 1; p <= Math.min(pdf.numPages, 60); p++) {
          const tc = await (await pdf.getPage(p)).getTextContent();
          let line = "";
          for (const it of tc.items) { line += it.str; if (it.hasEOL) { lines.push(line); line = ""; } }
          if (line) lines.push(line);
        }
        if (lines.join("").replace(/\s/g, "").length < 20) { S.imp = { status: "error", file: name, error: "This PDF looks like a scanned image, so it has no text to read. Upload the original Word file or paste the questions instead." }; render(); return; }
      } else if (ext === "xlsx") {
        const x = await readExcelFile(file);
        if (x.exact) { S.imp = { status: "ready", method: "excel", file: name, title: x.title || name.replace(/\.[^.]+$/, ""), description: "", questions: x.questions, text: x.questions.map((q, i) => `${i + 1}. ${q.text}\n${q.options.join("\n")}`).join("\n") }; render(); return; }
        lines = x.lines;
      } else if (["txt", "md", "text", "csv"].includes(ext) || (file.type || "").startsWith("text/")) {
        lines = (await file.text()).split(/\r?\n/);
      } else {
        S.imp = { status: "error", error: "Upload a Word (.docx), PDF or text (.txt) file." }; render(); return;
      }
      finishExtract(name, lines);
    } catch (e) {
      S.imp = { status: "error", file: name, error: e && e.message === "load" ? "The file reader couldn't load. Check your internet connection and try again." : "This file couldn't be read. It may be damaged or password-protected. Try saving it again, or paste the questions instead." };
      render();
    }
  }
  function finishExtract(name, lines) {
    const r = parseQuestionnaire(lines, name.replace(/\.[^.]+$/, ""));
    S.imp = { status: "ready", method: "auto", file: name, text: lines.join("\n").replace(/[\u0001-\u0003]/g, ""), ...r };
    render();
  }

  // Word HTML → lines. \u0001 = numbered list item, \u0002 = bullet / sub-item, \u0003 = heading.
  function htmlToLines(html) {
    const doc = new DOMParser().parseFromString(html, "text/html"), out = [];
    const isList = (n) => n.nodeType === 1 && (n.tagName === "OL" || n.tagName === "UL");
    function walkList(list, depth) {
      for (const li of list.children) {
        if (li.tagName !== "LI") continue;
        const own = [...li.childNodes].filter((c) => !isList(c)).map((c) => c.textContent).join(" ").trim();
        if (own) out.push((list.tagName === "OL" && depth === 0 ? "\u0001" : "\u0002") + own);
        for (const sub of li.children) if (isList(sub)) walkList(sub, depth + 1);
      }
    }
    function walk(el) {
      for (const n of el.children) {
        if (isList(n)) walkList(n, 0);
        else if (n.tagName === "TABLE") n.querySelectorAll("tr").forEach((tr) => [...tr.children].forEach((td) => { const t = td.textContent.trim(); if (t) out.push(t); }));
        else if (/^H[1-6]$/.test(n.tagName)) { const t = n.textContent.trim(); if (t) out.push("\u0003" + t); }
        else if (n.tagName === "P") { n.textContent.split(/\n/).forEach((t) => { t = t.trim(); if (t) out.push(t); }); }
        else walk(n);
      }
    }
    walk(doc.body);
    return out;
  }

  const RX_NUM = /^\s*(?:Q(?:uestion)?\s*)?(\d{1,3})\s*[.):\-]\s*(.+)$/i;
  const RX_QN = /^\s*Q(?:uestion)?\s*(\d{1,3})\s+(.+)$/i;
  const RX_OPT = /^\s*(?:\(?[a-hA-H][).\]]|\((?:i|ii|iii|iv|v|vi|vii|viii)\)|(?:i|ii|iii|iv|v|vi|vii|viii)\)|[•●○◦▪■□☐❑◻▢⬜◯\-–—*·]|\[\s?\]|\(\s?\)|o(?=\s))\s*(.+)$/;
  const BOXES = /[□☐❑◻▢⬜○◯]/;
  const cleanQ = (t) => t.replace(/\s*[_.]{3,}\s*$/, "").replace(/\s+/g, " ").trim();
  const cleanOpt = (t) => t.replace(/[□☐❑◻▢⬜○◯]/g, "").replace(/^\s*(?:\(?[a-hA-H][).\]]|[•●◦▪■\-–—*·])\s+/, "").replace(/\s*[_.]{3,}\s*$/, "").replace(/[:\s]+$/, "").replace(/\s+/g, " ").trim();
  function inferType(q) {
    const t = q.text.toLowerCase(), o = q.options;
    if (o.length >= 2) {
      if (o.length >= 3 && o.every((x) => /^\d{1,2}$/.test(x))) {
        const ns = o.map(Number);
        if (ns.every((v, j) => j === 0 || v === ns[j - 1] + 1) && (ns[0] === 0 || ns[0] === 1) && ns[ns.length - 1] <= 10) { q.scale = { min: ns[0], max: ns[ns.length - 1] }; q.options = []; return "rating"; }
      }
      if (o.length >= 3 && o.every((x) => LIKERT_WORDS.test(x))) return "likert";
      if (/(all that apply|select all|tick all|check all|choose all|mark all|more than one|select (up to|any)|multiple answers)/.test(t)) return "multi";
      return "single";
    }
    q.options = [];
    const r = t.match(/\b([01])\s*(?:-|–|to)\s*(\d{1,2})\b/);
    if (r && /(scale|rate|rating|how likely|how satisfied|recommend|agree)/.test(t) && +r[2] >= 2 && +r[2] <= 10) { q.scale = { min: +r[1], max: +r[2] }; return "rating"; }
    if (/(on a scale|\brate\b|\brating\b)/.test(t)) return "rating";
    if (/\b(how many|how much|how old|your age|what is your age|number of|in years|amount)\b/.test(t) || /^age\b/.test(t)) return "number";
    return "text";
  }
  function parseQuestionnaire(raw, fallbackTitle) {
    const cleaned = raw.map((l) => String(l).replace(/[ \t ]+/g, " ").trim()).filter((l) => l.replace(/[\u0001-\u0003]/g, "").trim());
    const bare = (l) => /^\d{1,2}$/.test(l);
    // Drop page numbers ("Page 2", "2 of 5", or a lone number), but keep runs of bare numbers: those are scale options (1 2 3 4 5).
    const lines = cleaned.filter((l, i) => {
      if (/^[\u0001-\u0003]?page\s*\d+(\s*(of|\/)\s*\d+)?$/i.test(l) || /^\d+\s*(of|\/)\s*\d+$/i.test(l)) return false;
      if (bare(l)) return bare(cleaned[i - 1] || "") || bare(cleaned[i + 1] || "");
      return true;
    });
    const qs = [], pre = [];
    let cur = null, lastN = 0;
    const startQ = (text) => { cur = { text: cleanQ(text), options: [] }; qs.push(cur); };
    const addOpt = (text) => { const o = cleanOpt(text); if (o && cur.options.length < 30 && !cur.options.includes(o)) cur.options.push(o); };
    const optionLike = (text) => cur && text.length < 90 && !/\?\s*$/.test(text) && (cur.options.length > 0 || /[?:]\s*$/.test(cur.text) || /\((please )?(select|tick|choose|check|circle)/i.test(cur.text));
    for (let line of lines) {
      let kind = "";
      if (line[0] === "\u0001") { kind = "num"; line = line.slice(1).trim(); }
      else if (line[0] === "\u0002") { kind = "bullet"; line = line.slice(1).trim(); }
      else if (line[0] === "\u0003") { if (!qs.length) pre.push(line.slice(1).trim()); continue; }
      // "Do you smoke? ☐ Yes ☐ No" → question + inline options
      if (BOXES.test(line)) {
        const parts = line.split(BOXES).map((s) => s.trim());
        const headTxt = parts.shift(), opts = parts.filter(Boolean);
        if (opts.length >= 2 || (opts.length && cur && !headTxt)) {
          if (headTxt) { const m = headTxt.match(RX_NUM) || headTxt.match(RX_QN); if (m) lastN = +m[1]; startQ(m ? m[2] : headTxt); }
          if (cur) opts.forEach(addOpt);
          continue;
        }
      }
      if (kind === "bullet") { if (cur) addOpt(line); else pre.push(line); continue; }
      if (kind === "num") {
        const asOption = cur && !/\?/.test(line) && line.length < 60 && optionLike(line) && (!cur.options.length || cur.optSrc === "num");
        if (asOption) { addOpt(line); cur.optSrc = "num"; } else startQ(line);
        continue;
      }
      if (bare(line)) { if (cur) addOpt(line); continue; }
      const m = line.match(RX_NUM) || line.match(RX_QN);
      if (m && !/^\d+\s*[.)]\s*\d/.test(line)) {
        const n = +m[1];
        if (!cur || n === lastN + 1 || /\?\s*$/.test(m[2]) || !optionLike(m[2])) { startQ(m[2]); lastN = n; }
        else addOpt(m[2]);
        continue;
      }
      const o = line.match(RX_OPT);
      if (o && cur) { addOpt(o[1]); continue; }
      if (/\?\s*$/.test(line) && line.length > 8) { startQ(line); continue; }
      if (cur) {
        const scaleWord = line.length < 45 && !/\?/.test(line) && LIKERT_WORDS.test(line);
        if ((optionLike(line) || scaleWord) && line.length < 70 && !/\.\s*$/.test(line)) addOpt(line);
        else if (!cur.options.length && cur.text.length < 400) cur.text = cleanQ(cur.text + " " + line);
        continue;
      }
      pre.push(line);
    }
    const questions = qs.filter((q) => q.text.length > 2).slice(0, 150).map((q) => { const type = inferType(q); return { type, text: q.text.slice(0, 500), options: q.options, required: true, scale: q.scale }; });
    const t = pre.find((l) => l.length <= 120) || fallbackTitle;
    const description = pre.filter((l) => l !== t).join(" ").slice(0, 600);
    return { title: t.slice(0, 120), description, questions };
  }

  async function readWithAI() {
    const im = S.imp;
    if (!SAMPLE || !im.text) return;
    const prev = clone(im);
    S.imp = { ...im, status: "ai" }; render();
    aiCtl = new AbortController();
    const prompt = `You convert a questionnaire document into online survey questions.
Reply with only JSON in exactly this shape:
{"title": "string", "description": "string", "questions": [{"type": "single", "text": "string", "options": ["string"], "required": true}]}
Rules:
- type is one of: "single" (choose one answer), "multi" (choose all that apply), "rating" (a numbered scale such as 1–5, 1–7, 1–9, 1–10 or 0–10), "likert" (a labelled scale such as Strongly disagree … Strongly agree, Never … Always, Very dissatisfied … Very satisfied), "number" (asks for a number, amount or age), "text" (open answer).
- Keep each question's wording as written, without its number. Put answer choices in "options" without letters, bullets or numbers. Use [] for rating, number and text.
- For "likert", put the scale labels in "options" from lowest to highest.
- For "rating", add "scale": {"min": 0 or 1, "max": a whole number from 2 to 10, "minLabel": "label of the lowest point, or empty", "maxLabel": "label of the highest point, or empty"}.
- A grid or matrix (several statements rated on the same scale) becomes one question per statement, each with the same scale.
- Skip headings, instructions, consent text, thank-you notes, and questions asking for a name, email, phone number or address.
- "title" is the questionnaire's title. "description" is one or two sentences from its introduction, or "".

Document:
"""
${im.text.slice(0, 60000)}
"""`;
    try {
      const r = await SAMPLE.json(prompt, { signal: aiCtl.signal });
      const qs = normAIQs(r && r.questions);
      S.imp = { ...prev, status: "ready", method: "ai", title: String(r.title || prev.title || "").slice(0, 120) || prev.title, description: String(r.description || "").slice(0, 600), questions: qs };
    } catch (e) {
      const code = e && e.code;
      S.imp = { ...prev, status: "ready" };
      if (code === "not_granted" || code === "sampling_disabled") { SAMPLE = null; toast("AI reading is turned off for this page. The automatic result is shown."); }
      else if (code === "rate_limited") toast("You've used AI reading a lot recently. Try again later.");
      else if (code !== "cancelled") toast("Claude couldn't read the file this time. The automatic result is shown.");
    }
    aiCtl = null;
    render();
  }
  function openImported() {
    const im = S.imp;
    const d = draftFromTemplate(null);
    d.title = im.title || ""; d.description = im.description || "";
    d.questions = im.questions.map((q) => ({ ...mkQ(q.type, q.text, q.options, q.scale), required: q.required !== false }));
    d.minutes = Math.max(2, Math.round(d.questions.length * 0.6));
    d.reward = Math.ceil((MIN_HOURLY * 1.25 * d.minutes / 60) * 20) / 20;
    S.draft = d; saveDraftLocal();
    S.importNote = `Imported ${d.questions.length} questions from ${im.file}. Check each question's type and answer options, set your audience and pay, then launch. The time estimate and reward were set from the number of questions.`;
    S.imp = { status: "idle" };
    go("create");
  }

  // ---------- boot ----------
  async function boot() {
    route(); render();
    const c = window.claude;
    if (!c || typeof c.use !== "function") {
      if (/^https?:$/.test(location.protocol)) { try { const me = await api("GET", "/api/me"); if (me && me.uid) { await startServer(me); return; } } catch (e) {} }
      DL = browserDL; startDemo(); return;
    }
    let db = null, user = null;
    try { [db, user, DL, SAMPLE] = await Promise.all([c.use("db"), c.use("user"), c.use("downloads"), c.use("sample")]); } catch (e) {}
    if (S.view === "import" || S.view === "home" || S.view === "create" || S.view === "results") render();
    const uid = user ? await user.id() : null;
    if (!db || !uid) { startDemo(); return; }
    DB = db; S.uid = uid; S.isOwner = await user.isOwner();
    let gotStudies = false, gotResp = false;
    const timer = setTimeout(() => { S.stale = true; if (S.mode === "loading") S.mode = "live"; softRender(); }, 10000);
    const settle = (snap) => { if (!snap.metadata.fromCache && gotStudies && gotResp) { clearTimeout(timer); S.stale = false; } };
    const fail = (what) => (err) => { clearTimeout(timer); S.mode = "live"; S.notice = `Couldn't load ${what} (${err.code}). Reload the page to try again.`; softRender(); };
    DB.collection("studies").onSnapshot((snap) => { S.studies = snap.docs.map((d) => ({ ...d.data(), id: d.id })); gotStudies = true; if (gotResp) S.mode = "live"; settle(snap); softRender(); }, fail("studies"));
    DB.collection("fieldwork").limit(1000).onSnapshot((snap) => { S.fieldwork = snap.docs.flatMap((d) => (((d.data() || {}).requests) || []).map((r) => ({ ...r, requesterId: d.id }))); softRender(); }, () => {});
    DB.collection("actions").limit(1000).onSnapshot((snap) => { S.actions = snap.docs.map((d) => ({ ...d.data(), id: d.id })); softRender(); }, () => {});
    DB.collection("responses").limit(1000).onSnapshot((snap) => { S.responses = snap.docs.map((d) => ({ ...d.data(), id: d.id })); gotResp = true; if (gotStudies) S.mode = "live"; settle(snap); softRender(); }, fail("responses"));
    try { const p = await DB.doc("data/users/" + uid + "/profile").get(); if (p.exists) S.profile = p.data(); } catch (e) {}
    softRender();
  }
  boot();
})();
</script>
