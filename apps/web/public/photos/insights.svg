<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Illustration of a data insights dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1d3a"/><stop offset="1" stop-color="#1b2d57"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c46a" stop-opacity=".45"/><stop offset="1" stop-color="#e9c46a" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity=".07"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="1450" cy="120" r="260" fill="#b88a2c" opacity=".08"/>
  <circle cx="120" cy="820" r="220" fill="#3d5fa8" opacity=".18"/>
  <!-- main chart card -->
  <rect x="230" y="170" width="720" height="460" rx="26" fill="#ffffff" opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
  <rect x="270" y="210" width="190" height="16" rx="8" fill="#f2d27e" opacity=".9"/>
  <rect x="270" y="240" width="300" height="12" rx="6" fill="#ffffff" opacity=".3"/>
  <g stroke="#ffffff" stroke-opacity=".12" stroke-width="2">
    <line x1="270" y1="330" x2="910" y2="330"/><line x1="270" y1="410" x2="910" y2="410"/><line x1="270" y1="490" x2="910" y2="490"/><line x1="270" y1="570" x2="910" y2="570"/>
  </g>
  <path d="M270 540 L350 520 L430 530 L510 470 L590 485 L670 420 L750 400 L830 340 L910 300 L910 570 L270 570 Z" fill="url(#area)"/>
  <path d="M270 540 L350 520 L430 530 L510 470 L590 485 L670 420 L750 400 L830 340 L910 300" fill="none" stroke="#f2d27e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M270 560 L350 555 L430 548 L510 540 L590 520 L670 515 L750 500 L830 490 L910 470" fill="none" stroke="#8fa8dc" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="830" cy="340" r="12" fill="#0e1d3a" stroke="#f2d27e" stroke-width="5"/>
  <rect x="760" y="250" width="150" height="58" rx="12" fill="#f2d27e"/>
  <rect x="780" y="268" width="80" height="10" rx="5" fill="#0e1d3a" opacity=".8"/>
  <rect x="780" y="286" width="110" height="8" rx="4" fill="#0e1d3a" opacity=".45"/>
  <!-- KPI tiles -->
  <g>
    <rect x="990" y="170" width="380" height="140" rx="22" fill="#ffffff" opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="1020" y="200" width="120" height="12" rx="6" fill="#ffffff" opacity=".35"/>
    <rect x="1020" y="235" width="170" height="40" rx="12" fill="#ffffff" opacity=".9"/>
    <path d="M1250 270 l30 -40 l30 22 l40 -55" fill="none" stroke="#84e2b3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="990" y="335" width="380" height="295" rx="22" fill="#ffffff" opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="1020" y="365" width="150" height="12" rx="6" fill="#ffffff" opacity=".35"/>
    <circle cx="1180" cy="505" r="85" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="34"/>
    <circle cx="1180" cy="505" r="85" fill="none" stroke="#e9c46a" stroke-width="34" stroke-dasharray="320 534" transform="rotate(-90 1180 505)"/>
    <circle cx="1180" cy="505" r="85" fill="none" stroke="#8fa8dc" stroke-width="34" stroke-dasharray="130 534" stroke-dashoffset="-326" transform="rotate(-90 1180 505)"/>
  </g>
  <!-- insight callout -->
  <g transform="translate(470 660)">
    <rect width="660" height="90" rx="45" fill="#f2d27e"/>
    <circle cx="45" cy="45" r="28" fill="#0e1d3a"/>
    <path d="M45 28 a12 12 0 0 1 8 21 v6 h-16 v-6 a12 12 0 0 1 8 -21 z M38 60 h14" fill="none" stroke="#f2d27e" stroke-width="4" stroke-linejoin="round"/>
    <rect x="95" y="30" width="420" height="12" rx="6" fill="#0e1d3a" opacity=".85"/>
    <rect x="95" y="52" width="300" height="10" rx="5" fill="#0e1d3a" opacity=".45"/>
  </g>
</svg>
