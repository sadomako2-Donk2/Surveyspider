<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Illustration of statistical charts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13244a"/><stop offset="1" stop-color="#0e1d3a"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1480" cy="800" r="300" fill="#b88a2c" opacity=".08"/>
  <!-- scatter with regression line -->
  <rect x="220" y="160" width="620" height="520" rx="26" fill="#ffffff" opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
  <line x1="280" y1="620" x2="800" y2="620" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
  <line x1="280" y1="620" x2="280" y2="210" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
  <g fill="#8fa8dc">
    <circle cx="320" cy="560" r="9"/><circle cx="350" cy="585" r="9"/><circle cx="380" cy="530" r="9"/><circle cx="410" cy="545" r="9"/>
    <circle cx="440" cy="500" r="9"/><circle cx="470" cy="520" r="9"/><circle cx="500" cy="470" r="9"/><circle cx="530" cy="490" r="9"/>
    <circle cx="560" cy="430" r="9"/><circle cx="590" cy="455" r="9"/><circle cx="620" cy="400" r="9"/><circle cx="650" cy="420" r="9"/>
    <circle cx="680" cy="360" r="9"/><circle cx="710" cy="385" r="9"/><circle cx="740" cy="330" r="9"/><circle cx="770" cy="300" r="9"/>
  </g>
  <g fill="#f2d27e"><circle cx="455" cy="560" r="9"/><circle cx="640" cy="350" r="9"/><circle cx="545" cy="410" r="9"/></g>
  <line x1="300" y1="590" x2="790" y2="300" stroke="#f2d27e" stroke-width="6" stroke-linecap="round"/>
  <rect x="560" y="200" width="220" height="56" rx="12" fill="#f2d27e"/>
  <rect x="582" y="220" width="130" height="14" rx="7" fill="#0e1d3a" opacity=".8"/>
  <!-- histogram with normal curve -->
  <rect x="890" y="160" width="490" height="320" rx="26" fill="#ffffff" opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
  <g fill="#3d5fa8">
    <rect x="940" y="400" width="44" height="40" rx="4"/><rect x="990" y="350" width="44" height="90" rx="4"/><rect x="1040" y="280" width="44" height="160" rx="4"/>
    <rect x="1090" y="230" width="44" height="210" rx="4"/><rect x="1140" y="270" width="44" height="170" rx="4"/><rect x="1190" y="340" width="44" height="100" rx="4"/>
    <rect x="1240" y="390" width="44" height="50" rx="4"/><rect x="1290" y="420" width="44" height="20" rx="4"/>
  </g>
  <path d="M930 435 C1010 430 1040 230 1112 222 C1190 230 1230 420 1340 435" fill="none" stroke="#f2d27e" stroke-width="5"/>
  <!-- table of results -->
  <rect x="890" y="510" width="490" height="170" rx="26" fill="#ffffff" opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
  <g fill="#ffffff">
    <rect x="925" y="545" width="150" height="12" rx="6" opacity=".45"/><rect x="1110" y="545" width="90" height="12" rx="6" opacity=".45"/><rect x="1240" y="545" width="100" height="12" rx="6" opacity=".45"/>
    <rect x="925" y="590" width="190" height="10" rx="5" opacity=".25"/><rect x="1110" y="590" width="70" height="10" rx="5" opacity=".25"/><rect x="1240" y="590" width="80" height="10" rx="5" fill="#f2d27e" opacity="1"/>
    <rect x="925" y="630" width="160" height="10" rx="5" opacity=".25"/><rect x="1110" y="630" width="80" height="10" rx="5" opacity=".25"/><rect x="1240" y="630" width="60" height="10" rx="5" opacity=".25"/>
  </g>
</svg>
