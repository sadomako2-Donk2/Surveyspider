<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Illustration of a survey on a tablet and a phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1d3a"/><stop offset="1" stop-color="#1d3260"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity=".07"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="200" cy="150" r="230" fill="#b88a2c" opacity=".09"/>
  <!-- tablet -->
  <rect x="360" y="150" width="620" height="620" rx="40" fill="#0a1530" stroke="#ffffff" stroke-opacity=".25" stroke-width="4"/>
  <rect x="390" y="180" width="560" height="560" rx="20" fill="#f4f6fb"/>
  <rect x="390" y="180" width="560" height="10" fill="#b88a2c"/>
  <rect x="425" y="225" width="300" height="18" rx="9" fill="#0e1d3a"/>
  <rect x="425" y="255" width="200" height="12" rx="6" fill="#0e1d3a" opacity=".35"/>
  <rect x="425" y="290" width="490" height="10" rx="5" fill="#dde2ec"/><rect x="425" y="290" width="300" height="10" rx="5" fill="#b88a2c"/>
  <!-- question 1: likert -->
  <rect x="425" y="330" width="380" height="14" rx="7" fill="#0e1d3a" opacity=".75"/>
  <g>
    <circle cx="455" cy="395" r="20" fill="#fff" stroke="#9aa6bf" stroke-width="3"/><circle cx="555" cy="395" r="20" fill="#fff" stroke="#9aa6bf" stroke-width="3"/>
    <circle cx="655" cy="395" r="20" fill="#fff" stroke="#9aa6bf" stroke-width="3"/><circle cx="755" cy="395" r="20" fill="#0e1d3a"/><circle cx="755" cy="395" r="8" fill="#f2d27e"/>
    <circle cx="855" cy="395" r="20" fill="#fff" stroke="#9aa6bf" stroke-width="3"/>
  </g>
  <!-- question 2: choices -->
  <rect x="425" y="455" width="330" height="14" rx="7" fill="#0e1d3a" opacity=".75"/>
  <g>
    <rect x="425" y="490" width="490" height="50" rx="12" fill="#fff" stroke="#dde2ec" stroke-width="3"/><rect x="445" y="505" width="20" height="20" rx="5" fill="#fff" stroke="#9aa6bf" stroke-width="3"/><rect x="485" y="510" width="160" height="10" rx="5" fill="#0e1d3a" opacity=".45"/>
    <rect x="425" y="552" width="490" height="50" rx="12" fill="#fbf4e3" stroke="#b88a2c" stroke-width="3"/><rect x="445" y="567" width="20" height="20" rx="5" fill="#b88a2c"/><path d="M449 577 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3"/><rect x="485" y="572" width="210" height="10" rx="5" fill="#0e1d3a" opacity=".6"/>
    <rect x="425" y="614" width="490" height="50" rx="12" fill="#fff" stroke="#dde2ec" stroke-width="3"/><rect x="445" y="629" width="20" height="20" rx="5" fill="#fff" stroke="#9aa6bf" stroke-width="3"/><rect x="485" y="634" width="130" height="10" rx="5" fill="#0e1d3a" opacity=".45"/>
  </g>
  <rect x="765" y="685" width="150" height="40" rx="10" fill="#0e1d3a"/><rect x="795" y="700" width="90" height="10" rx="5" fill="#f2d27e"/>
  <!-- phone with results -->
  <rect x="1050" y="250" width="270" height="500" rx="36" fill="#0a1530" stroke="#ffffff" stroke-opacity=".25" stroke-width="4"/>
  <rect x="1070" y="280" width="230" height="440" rx="18" fill="#f4f6fb"/>
  <rect x="1095" y="310" width="140" height="14" rx="7" fill="#0e1d3a"/>
  <g fill="#3d5fa8"><rect x="1095" y="350" width="170" height="22" rx="6"/><rect x="1095" y="384" width="120" height="22" rx="6"/><rect x="1095" y="418" width="80" height="22" rx="6"/><rect x="1095" y="452" width="40" height="22" rx="6"/></g>
  <rect x="1095" y="350" width="170" height="22" rx="6" fill="#b88a2c"/>
  <circle cx="1185" cy="590" r="70" fill="none" stroke="#dde2ec" stroke-width="26"/>
  <circle cx="1185" cy="590" r="70" fill="none" stroke="#b88a2c" stroke-width="26" stroke-dasharray="300 440" transform="rotate(-90 1185 590)"/>
  <!-- check badge -->
  <circle cx="1310" cy="250" r="52" fill="#f2d27e"/>
  <path d="M1285 252 l17 17 l32 -36" fill="none" stroke="#0e1d3a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
